<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarswati Vidya Mandir — School Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SARSWATI VIDYA MANDIR — Design tokens
   Palette: indigo ink (authority), marigold (celebration),
   temple maroon (identity), chalk green (positive states).
   Deliberately cool-toned paper, not the usual cream ERP.
   ============================================================ */
:root{
  --ink:#16233D; --ink-2:#3A4A69; --ink-3:#6B7A94;
  --paper:#EEF1F6; --surface:#FFFFFF; --surface-2:#F7F9FC;
  --line:#D9E0EC; --line-2:#C3CDDE;
  --brand:#1C2C4C; --brand-soft:#E7EBF4;
  --maroon:#8C2F39; --maroon-soft:#F7E9EA;
  --gold:#E0982B; --gold-soft:#FBF0DC;
  --green:#2E7D6B; --green-soft:#E3F1ED;
  --red:#B3261E; --red-soft:#FBE9E7;
  --blue:#2A5FA8; --blue-soft:#E6EEF9;
  --shadow:0 1px 2px rgba(22,35,61,.06), 0 8px 24px -12px rgba(22,35,61,.18);
  --shadow-lg:0 12px 40px -16px rgba(22,35,61,.35);
  --r-s:6px; --r-m:10px; --r-l:16px;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --deva:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  --sidebar-w:250px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EDF6; --ink-2:#B6C1D4; --ink-3:#8B97AD;
    --paper:#0E1523; --surface:#161F31; --surface-2:#1C2739;
    --line:#2A3650; --line-2:#3A4963;
    --brand:#7FA3DD; --brand-soft:#1E2A42;
    --maroon:#E08A94; --maroon-soft:#2E1E22;
    --gold:#EAB458; --gold-soft:#302713;
    --green:#6FC5AE; --green-soft:#122C27;
    --red:#F19B93; --red-soft:#2E1917;
    --blue:#8FB6ED; --blue-soft:#17233A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EDF6; --ink-2:#B6C1D4; --ink-3:#8B97AD;
  --paper:#0E1523; --surface:#161F31; --surface-2:#1C2739;
  --line:#2A3650; --line-2:#3A4963;
  --brand:#7FA3DD; --brand-soft:#1E2A42;
  --maroon:#E08A94; --maroon-soft:#2E1E22;
  --gold:#EAB458; --gold-soft:#302713;
  --green:#6FC5AE; --green-soft:#122C27;
  --red:#F19B93; --red-soft:#2E1917;
  --blue:#8FB6ED; --blue-soft:#17233A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.18;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.4vw,3.1rem)}
h2{font-size:clamp(1.4rem,2.6vw,2rem)}
h3{font-size:1.15rem}
h4{font-size:1rem}
p{margin:0 0 1rem}
.deva{font-family:var(--deva)}
.muted{color:var(--ink-3)}
.small{font-size:.83rem}
.nowrap{white-space:nowrap}
.mono-num{font-variant-numeric:tabular-nums}

/* ---------- crest / wordmark ---------- */
.crest{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%, #F3C063, var(--gold) 55%, #B9761A);
  color:#2A1B06;font-family:var(--serif);font-weight:700;font-size:1.05rem;letter-spacing:.02em;
  box-shadow:inset 0 0 0 2.5px var(--surface), inset 0 0 0 4px rgba(140,47,57,.55)}
.crest.sm{width:32px;height:32px;flex-basis:32px;font-size:.78rem;box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3px rgba(140,47,57,.5)}
.crest.lg{width:78px;height:78px;flex-basis:78px;font-size:1.7rem}
.wordmark{display:flex;align-items:center;gap:12px;text-decoration:none}
.wordmark .nm{font-family:var(--serif);font-weight:600;font-size:1.06rem;line-height:1.1}
.wordmark .sub{font-size:.72rem;color:var(--ink-3);line-height:1.2}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:var(--r-m);cursor:pointer;
  font-weight:600;font-size:.88rem;text-decoration:none;min-height:40px;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn-primary,:root:not([data-theme="light"]) .btn-primary{color:#0E1523}
.btn-primary:hover{background:#25395F}
:root[data-theme="dark"] .btn-primary:hover{background:#9BB8E6}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#2A1B06}
.btn-gold:hover{filter:brightness(1.06)}
.btn-danger{background:var(--red-soft);border-color:transparent;color:var(--red)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:5px 10px;min-height:32px;font-size:.8rem;border-radius:var(--r-s)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- cards / layout ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:1.02rem}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g-2-1{grid-template-columns:1fr}}
@media(max-width:620px){.g2,.g4{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---------- stat tiles ---------- */
.stat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  padding:16px 18px;box-shadow:var(--shadow);overflow:hidden}
.stat::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,var(--brand))}
.stat .lbl{font-size:.8rem;color:var(--ink-3);font-weight:600}
.stat .val{font-family:var(--serif);font-size:1.85rem;font-weight:600;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:.78rem;color:var(--ink-3);margin-top:3px}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.75rem;
  font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-gold{background:var(--gold-soft);color:#946010}
:root[data-theme="dark"] .b-gold{color:var(--gold)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-maroon{background:var(--maroon-soft);color:var(--maroon)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 8px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>label{font-size:.83rem;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:.76rem;color:var(--ink-3)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],
input[type=password],input[type=search],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r-m);
  background:var(--surface);min-height:40px;font-size:.92rem}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input[type=file]{width:100%;font-size:.85rem;padding:8px;border:1px dashed var(--line-2);border-radius:var(--r-m);background:var(--surface-2)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.check input{width:17px;height:17px;accent-color:var(--brand)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.form-grid .full{grid-column:1/-1}
@media(max-width:620px){.form-grid{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px 2px;margin:0 0 18px}
legend{font-family:var(--serif);font-weight:600;font-size:.95rem;padding:0 6px}
.err{color:var(--red);font-size:.78rem}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:.88rem;min-width:620px}
table.dt th{text-align:left;font-weight:600;font-size:.78rem;color:var(--ink-3);padding:10px 12px;
  border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
table.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt tbody tr:hover{background:var(--surface-2)}
table.dt .actions{display:flex;gap:5px;flex-wrap:wrap}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;
  font-weight:700;color:#fff;flex:0 0 32px;letter-spacing:.02em}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who .nm{font-weight:600;white-space:nowrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-l) var(--r-l) 0 0}
.toolbar input[type=search],.toolbar select{min-width:150px;width:auto;flex:0 1 auto;min-height:36px;padding:6px 10px;font-size:.85rem}
.toolbar select{background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty h4{font-family:var(--sans);font-size:.95rem;color:var(--ink-2);margin-bottom:4px}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--brand);color:#DCE5F5;display:flex;flex-direction:column;position:sticky;top:0;
  height:100vh;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="dark"] .sidebar,:root:not([data-theme="light"]) .sidebar{background:#101827}
.sidebar .brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar .brand .nm{font-family:var(--serif);font-size:.98rem;font-weight:600;color:#fff;line-height:1.15}
.sidebar .brand .sub{font-size:.68rem;color:#9FB2D4}
.side-nav{padding:10px 10px 24px;display:flex;flex-direction:column;gap:2px;flex:1}
.side-nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-m);
  color:#C4D2EA;text-decoration:none;font-size:.88rem;font-weight:500}
.side-nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.side-nav a.on{background:var(--gold);color:#2A1B06;font-weight:700}
.side-nav .sect{font-size:.68rem;color:#8298BE;padding:14px 12px 5px;font-weight:700;letter-spacing:.04em}
.side-nav .ic{width:18px;text-align:center;font-size:1rem;flex:0 0 18px}
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.main{min-width:0;display:flex;flex-direction:column}
.page{padding:22px 20px 60px;max-width:1400px;width:100%;margin:0 auto}
.page-h{margin-bottom:18px}
.page-h .ttl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hamb{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);
    transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .hamb{display:inline-flex}
  .scrim{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:55}
  .page{padding:16px 14px 70px}
}
.gsearch{position:relative;flex:1;max-width:460px}
.gsearch input{min-height:38px;padding-left:34px}
.gsearch .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:var(--shadow-lg);max-height:340px;overflow:auto;z-index:50}
.gres a{display:block;padding:9px 12px;text-decoration:none;border-bottom:1px solid var(--line);font-size:.87rem}
.gres a:hover{background:var(--surface-2)}
.gres .k{font-size:.7rem;color:var(--ink-3)}
.iconbtn{width:38px;height:38px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;position:relative;font-size:1rem;flex:0 0 38px}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .cnt{position:absolute;top:-5px;right:-5px;background:var(--maroon);color:#fff;font-size:.62rem;
  font-weight:700;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:var(--shadow-lg);min-width:250px;z-index:50;overflow:hidden}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:0;
  cursor:pointer;font-size:.88rem;text-decoration:none;border-bottom:1px solid var(--line)}
.menu a:hover,.menu button:hover{background:var(--surface-2)}
.menu .hd{padding:10px 14px;background:var(--surface-2);font-size:.78rem;font-weight:700;border-bottom:1px solid var(--line)}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.84rem}
.notif-item.unread{background:var(--blue-soft)}

/* ---------- modal / toast ---------- */
.mbk{position:fixed;inset:0;background:rgba(10,16,28,.55);z-index:200;display:flex;align-items:flex-start;
  justify-content:center;padding:24px 14px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r-l);width:100%;max-width:640px;box-shadow:var(--shadow-lg);
  margin:auto;border:1px solid var(--line)}
.modal.wide{max-width:920px}
.modal.narrow{max-width:430px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-b{padding:20px;max-height:70vh;overflow-y:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toasts{position:fixed;right:16px;bottom:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:300;
  display:flex;flex-direction:column;gap:9px;max-width:min(370px,calc(100vw - 32px))}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);
  border-radius:var(--r-m);padding:11px 14px;box-shadow:var(--shadow-lg);font-size:.88rem;display:flex;gap:9px;align-items:flex-start}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--gold)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{animation:pop .18s ease}

/* ---------- tabs / progress / misc ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:600;font-size:.88rem;
  color:var(--ink-3);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.prog{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.prog>i{display:block;height:100%;background:var(--green);border-radius:999px}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 14px;font-size:.9rem}
.kv dt{color:var(--ink-3);font-size:.82rem}
.kv dd{margin:0;font-weight:500}
.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;
  font-size:.8rem;cursor:pointer;font-weight:600}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
:root[data-theme="dark"] .chip.on{color:#0E1523}
.att-btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:6px 12px;
  cursor:pointer;font-size:.8rem;font-weight:600;min-height:34px}
.att-btn.P.on{background:var(--green);border-color:var(--green);color:#fff}
.att-btn.A.on{background:var(--red);border-color:var(--red);color:#fff}
.att-btn.L.on{background:var(--gold);border-color:var(--gold);color:#2A1B06}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-size:.7rem;color:var(--ink-3);text-align:center;font-weight:700;padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:var(--r-s);display:grid;place-items:center;font-size:.8rem;
  background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.cal .d.P{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.cal .d.A{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:700}
.cal .d.L{background:var(--gold-soft);border-color:var(--gold);color:#946010;font-weight:700}
.cal .d.off{opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-3);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.timetable td,.timetable th{font-size:.82rem}
.tt-cell{font-weight:600}
.tt-cell small{display:block;font-weight:400;color:var(--ink-3);font-size:.72rem}
.demo-banner{background:var(--gold-soft);border-bottom:1px solid var(--gold);color:#6B4508;
  font-size:.8rem;padding:7px 16px;text-align:center}
:root[data-theme="dark"] .demo-banner{color:var(--gold)}
.receipt{font-family:var(--sans);color:#16233D;background:#fff;padding:26px;border:1px solid var(--line);border-radius:var(--r-m)}
.receipt .rh{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #8C2F39;padding-bottom:12px;margin-bottom:16px}
.receipt table{width:100%;border-collapse:collapse;font-size:.86rem;margin:12px 0}
.receipt th,.receipt td{border:1px solid #D9E0EC;padding:7px 10px;text-align:left}
.receipt th{background:#F7F9FC}

/* ---------- public website ---------- */

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts"></div>
<script>
"use strict";
/* ============================================================
   1. UTILITIES
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '-' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const pad = (n,l=3) => String(n).padStart(l,'0');
const money = n => '₹' + Number(n||0).toLocaleString('en-IN');
const moneyPlain = n => 'Rs. ' + Number(n||0).toLocaleString('en-IN');
const iso = d => (d instanceof Date ? d : new Date(d)).toISOString().slice(0,10);
const today = () => iso(new Date());
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDate = d => { if(!d) return '—'; const x=new Date(d); return isNaN(x)?d:`${x.getDate()} ${MONTHS[x.getMonth()].slice(0,3)} ${x.getFullYear()}`; };
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const hueOf = s => { let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))%360; return h; };
const avatar = (name, size) => `<span class="avatar" style="background:hsl(${hueOf(name)} 42% 42%)${size?`;width:${size}px;height:${size}px;flex-basis:${size}px;font-size:${size/2.7}px`:''}">${esc(initials(name))}</span>`;
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
const sum = a => a.reduce((x,y)=>x+(Number(y)||0),0);
const byId = (arr,id) => arr.find(r=>r.id===id);
const sortBy = (arr,k) => [...arr].sort((a,b)=> String(a[k]??'').localeCompare(String(b[k]??''), undefined, {numeric:true}));
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/864e5);
function academicYear(){ const d=new Date(); const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1; return `${y}-${String(y+1).slice(2)}`; }
function debounce(fn,ms=220){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);}; }

/* Grade calculation — single source of truth for the whole app */
const PASS_PCT = 35;
function gradeOf(pct){
  if(pct>=91) return 'A+'; if(pct>=81) return 'A'; if(pct>=71) return 'B+';
  if(pct>=61) return 'B';  if(pct>=51) return 'C'; if(pct>=PASS_PCT) return 'D'; return 'F';
}
const gradeBadge = g => `<span class="badge ${g==='F'?'b-red':(g==='A+'||g==='A')?'b-green':'b-blue'}">${esc(g)}</span>`;

/* ============================================================
   2. DEMO PASSWORD HASHING
   Demo only. Real deployments must hash on the SERVER with
   bcrypt/argon2 — a browser hash is not authentication.
   ============================================================ */
async function hashPassword(pw, salt){
  const txt = salt + '::' + pw;
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h = 5381; for(const c of txt) h = ((h*33) ^ c.charCodeAt(0)) >>> 0;
  return 'weak' + h.toString(16);
}
const newSalt = () => Math.random().toString(36).slice(2,12);

/* ============================================================
   3. DATABASE LAYER
   Normalised tables + relationships. Persisted to localStorage
   (wrapped, with an in-memory fallback). Swapping this module
   for fetch() calls to a REST API is the only change needed to
   move the app onto a real backend.
   ============================================================ */
const KEY = 'svm.erp.v1';
const TABLES = ['settings','users','students','parents','teachers','classes','divisions','subjects',
  'attendance','teacher_attendance','leaves','admissions','fee_heads','invoices','payments',
  'exams','marks','timetable','homework','submissions','notices','events','documents','notifications'];

const Store = {
  mem:null, ok:true,
  read(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ this.ok=false; return this.mem; } },
  write(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){ this.ok=false; this.mem=v; } },
  clear(){ try{ localStorage.removeItem(KEY); }catch(e){} this.mem=null; }
};

const DB = {
  d:null,
  load(){ this.d = Store.read(); return !!this.d; },
  save(){ Store.write(this.d); },
  all(t){ return this.d[t] || []; },
  get(t,id){ return byId(this.all(t), id); },
  where(t,fn){ return this.all(t).filter(fn); },
  first(t,fn){ return this.all(t).find(fn); },
  insert(t,rec){ rec.id = rec.id || uid(t.slice(0,3)); this.d[t].push(rec); this.save(); return rec; },
  update(t,id,patch){ const r=this.get(t,id); if(r){ Object.assign(r,patch); this.save(); } return r; },
  upsert(t,match,rec){ const e=this.first(t,match); if(e){ Object.assign(e,rec); this.save(); return e; } return this.insert(t,rec); },
  remove(t,id){ const i=this.all(t).findIndex(r=>r.id===id); if(i>-1){ this.d[t].splice(i,1); this.save(); return true; } return false; },
  seq(t,prefix,len=4){ const s=this.d.settings; s.seq=s.seq||{}; s.seq[t]=(s.seq[t]||0)+1; this.save(); return prefix+pad(s.seq[t],len); }
};

/* --- relationship helpers (joins) --- */
const S = {
  cls: id => DB.get('classes',id)?.name || '—',
  div: id => DB.get('divisions',id)?.name || '—',
  subj: id => DB.get('subjects',id)?.name || '—',
  teacher: id => DB.get('teachers',id)?.name || '—',
  student: id => DB.get('students',id)?.name || '—',
  classFull: (c,d) => `${S.cls(c)}${d?' '+S.div(d):''}`,
  divisionsOf: cid => DB.where('divisions', d=>d.classId===cid),
  studentsOf: (cid,did) => DB.where('students', s=>s.status==='active' && (!cid||s.classId===cid) && (!did||s.divisionId===did)),
  parentOf: s => DB.get('parents', s?.parentId) || {},
  settings: () => DB.d.settings
};

/* ============================================================
   4. DEMO SEED DATA  (fictional — no real people)
   ============================================================ */
const FIRST_M = ['Aarav','Rohan','Kabir','Vivaan','Arjun','Ishaan','Atharva','Soham','Yash','Neel','Om','Sarthak','Rudra','Tanay','Pranav','Vedant'];
const FIRST_F = ['Aditi','Sneha','Anaya','Riya','Isha','Tanvi','Mira','Saanvi','Gauri','Janhvi','Shruti','Ketaki','Radha','Nisha','Sakshi','Avni'];
const LAST = ['Sharma','Patil','Deshmukh','Kulkarni','Joshi','Jadhav','More','Pawar','Chavan','Gaikwad','Shinde','Bhosale','Kale','Sawant','Thakur','Mane'];
const BLOOD = ['A+','B+','O+','AB+','A-','O-'];
const OCC = ['Farmer','Shopkeeper','Teacher','Engineer','Bank Clerk','Tailor','Driver','Nurse','Carpenter','Self-employed'];
const AREAS = ['Shivaji Nagar','Gandhi Chowk','Nehru Road','Tilak Wadi','Rani Laxmibai Marg','Krishna Colony','Vidya Nagar'];
const pick = (a,i) => a[i % a.length];
const rnd = (n) => Math.floor(Math.random()*n);

async function seed(){
  const d = {}; TABLES.forEach(t => d[t] = []);
  const AY = academicYear();

  /* ---- settings (everything here is admin-editable) ---- */
  d.settings = {
    schoolName:'Sarswati Vidya Mandir',
    nameDevanagari:'सरस्वती विद्या मंदिर',
    shortName:'SVM',
    tagline:'Education • Character • Excellence',
    established:'1978',
    address:'Vidya Nagar, Station Road, Pune, Maharashtra 411001',
    phone:'+91 20 2456 7890',
    email:'office@sarswativm.edu.in',
    academicYear:AY,
    timings:'Monday to Saturday, 7:30 am – 1:30 pm',
    officeTimings:'9:00 am – 4:00 pm',
    principal:'Dr. Meenakshi Rao',
    mapQuery:'Vidya Nagar, Pune',
    about:'Sarswati Vidya Mandir has taught the children of this town since 1978. We follow the state board curriculum from Class 1 to Class 10, with small classes, teachers who stay for decades, and a conviction that a child learns best when school feels safe.',
    principalMessage:'A school is judged by what its children become, not by what its brochure claims. Our teachers know every child by name. We ask parents for one thing only — talk to us early, not late. Our doors are open every working morning.',
    stats:{ students:'1,250', teachers:'65', classes:'20', years:'47' },
    receiptNote:'This is a computer-generated receipt. Please retain it for your records.',
    googleClientId:'',
    seq:{}
  };

  /* ---- classes & divisions ---- */
  const CLASS_NAMES = ['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th'];
  CLASS_NAMES.forEach((n,i)=>{
    const c = {id:'cls'+(i+1), name:n, level:i+1, order:i+1};
    d.classes.push(c);
    ['A','B'].forEach(dv => d.divisions.push({id:'div'+(i+1)+dv, classId:c.id, name:dv}));
  });

  /* ---- subjects ---- */
  const SUBJ = [['Marathi','MAR'],['Hindi','HIN'],['English','ENG'],['Mathematics','MAT'],
    ['Science','SCI'],['Social Science','SST'],['Computer Science','CMP'],['Drawing','DRW'],
    ['Physical Education','PED'],['Sanskrit','SAN']];
  SUBJ.forEach((s,i)=> d.subjects.push({id:'sub'+(i+1), name:s[0], code:s[1],
    core:i<6, classIds: i<6 ? d.classes.map(c=>c.id) : d.classes.slice(4).map(c=>c.id)}));
  const coreSubjects = d.subjects.filter(s=>s.core).map(s=>s.id);

  /* ---- teachers ---- */
  const TEACHERS = [
    ['Priya Sharma','M.Sc., B.Ed.', ['sub4','sub5'], '2012-06-11'],
    ['Rahul Patil','M.A., B.Ed.', ['sub1','sub6'], '2015-07-01'],
    ['Neha Kulkarni','M.A. English, B.Ed.', ['sub3'], '2009-06-15'],
    ['Sanjay Deshpande','M.Sc. Maths, M.Ed.', ['sub4'], '2006-06-12'],
    ['Asha Jadhav','B.A., D.Ed.', ['sub2','sub10'], '2018-06-04'],
    ['Vikram More','MCA, B.Ed.', ['sub7'], '2019-08-19'],
    ['Sunita Pawar','M.Sc. Botany, B.Ed.', ['sub5'], '2014-06-09'],
    ['Deepak Chavan','B.P.Ed.', ['sub9'], '2016-06-20'],
    ['Manisha Gaikwad','M.A. History, B.Ed.', ['sub6'], '2011-06-13'],
    ['Ramesh Shinde','B.F.A.', ['sub8'], '2020-07-06']
  ];
  TEACHERS.forEach((t,i)=>{
    d.teachers.push({ id:'tch'+(i+1), code:'TCH-'+pad(i+1), name:t[0], qualification:t[1],
      subjectIds:t[2], classIds: d.classes.slice(rnd(4), 6+rnd(4)).map(c=>c.id),
      phone:'+91 98'+(22000000+i*13457), email:t[0].toLowerCase().replace(/\s+/g,'.')+'@sarswativm.edu.in',
      joiningDate:t[3], gender: ['Priya','Neha','Asha','Sunita','Manisha'].includes(t[0].split(' ')[0])?'Female':'Male',
      designation: i===0?'Senior Teacher':'Assistant Teacher', status:'active' });
  });

  /* ---- students + parents ---- */
  const NAMED = ['Aarav Sharma','Aditi Patil','Rohan Deshmukh','Sneha Kulkarni','Kabir Joshi'];
  let sIdx = 0;
  d.classes.forEach((c, ci) => {
    S_LOOP: for(const dv of ['A','B']){
      const count = ci < 5 ? 4 : 3;
      for(let r=1; r<=count; r++){
        sIdx++;
        const male = sIdx % 2 === 0;
        const name = sIdx<=5 ? NAMED[sIdx-1]
          : (male ? pick(FIRST_M, sIdx*3) : pick(FIRST_F, sIdx*5)) + ' ' + pick(LAST, sIdx*7);
        const last = name.split(' ').pop();
        const p = { id:'par'+sIdx,
          fatherName: pick(['Suresh','Mahesh','Ganesh','Dattatray','Prakash','Anil','Nitin','Sachin'], sIdx*2)+' '+last,
          motherName: pick(['Sunita','Vaishali','Rekha','Sarita','Manda','Jyoti','Ujwala','Shobha'], sIdx*3)+' '+last,
          guardianName:'', phone:'+91 94'+(21000000 + sIdx*36721),
          email: last.toLowerCase()+sIdx+'@example.com', occupation: pick(OCC, sIdx*2) };
        d.parents.push(p);
        const birthYear = new Date().getFullYear() - (5 + c.level);
        d.students.push({
          id:'stu'+sIdx, code:'SVM-'+AY.slice(0,4)+'-'+pad(sIdx,4), name,
          classId:c.id, divisionId:'div'+(ci+1)+dv, rollNo:r,
          dob: `${birthYear}-${pad(1+rnd(12),2)}-${pad(1+rnd(27),2)}`,
          gender: male?'Male':'Female', bloodGroup: pick(BLOOD, sIdx),
          address: `${10+sIdx}, ${pick(AREAS,sIdx)}, Pune 411001`,
          parentId:p.id, admissionDate:`${AY.slice(0,4)}-06-1${sIdx%9}`, status:'active',
          transport: sIdx % 4 === 0
        });
      }
    }
  });

  /* ---- users (demo credentials — replace with server auth) ---- */
  const mk = async (username, pw, role, name, linkedId, email) => {
    const salt = newSalt();
    d.users.push({ id:uid('usr'), username, salt, hash: await hashPassword(pw, salt),
      role, name, linkedId, email: email||'', active:true, createdAt:today() });
  };
  await mk('admin','admin123','admin','Dr. Meenakshi Rao', null, 'meenakshi.rao@sarswativm.edu.in');
  await mk('teacher','teacher123','teacher','Priya Sharma','tch1', d.teachers.find(t=>t.id==='tch1')?.email);
  await mk('student','student123','student', d.students[0].name, d.students[0].id,
    (d.parents.find(p=>p.id===d.students[0].parentId)||{}).email);
  await mk('rahul.patil','teacher123','teacher','Rahul Patil','tch2', d.teachers.find(t=>t.id==='tch2')?.email);
  await mk('office','admin123','admin','Office Clerk', null, 'admissions@sarswativm.edu.in');

  /* ---- fee heads (admin-configurable) ---- */
  const HEADS = [['Admission Fee',2000,'one-time'],['Tuition Fee',9000,'annual'],['Examination Fee',900,'annual'],
    ['Library Fee',600,'annual'],['Laboratory Fee',1200,'annual'],['Transport Fee',6000,'optional'],
    ['Activity & Sports Fee',800,'annual']];
  HEADS.forEach((h,i)=> d.fee_heads.push({ id:'fh'+(i+1), name:h[0], amount:h[1], frequency:h[2],
    appliesTo: h[0]==='Laboratory Fee' ? d.classes.slice(4).map(c=>c.id) : 'all',
    optional: h[0]==='Transport Fee' }));

  /* ---- invoices: every active student gets a fee record for the year ---- */
  d.students.forEach((s, i) => {
    const items = d.fee_heads.filter(h =>
      (h.appliesTo==='all' || h.appliesTo.includes(s.classId)) &&
      (!h.optional || s.transport) &&
      (h.frequency!=='one-time' || s.admissionDate.startsWith(AY.slice(0,4)))
    ).map(h => ({ headId:h.id, name:h.name, amount:h.amount }));
    d.invoices.push({ id:'inv'+(i+1), studentId:s.id, academicYear:AY, items,

const SKEY = 'svm.session.v1';
const Auth = {
  user:null,
  restore(){
    try{ const r = JSON.parse(localStorage.getItem(SKEY)||'null');
      if(r && Date.now()-r.at < 12*3600e3){ const u = DB.get('users', r.userId); if(u&&u.active){ this.user=u; return true; } }
    }catch(e){}
    return false;
  },
  async login(username, password){
    const u = DB.first('users', x => x.username.toLowerCase() === String(username).trim().toLowerCase());
    if(!u || !u.active) return { ok:false, msg:'No account found with that username.' };
    const h = await hashPassword(password, u.salt);
    if(h !== u.hash) return { ok:false, msg:'That password does not match our records.' };
    this.user = u;
    try{ localStorage.setItem(SKEY, JSON.stringify({ userId:u.id, at:Date.now() })); }catch(e){}
    return { ok:true, user:u };
  },
  async loginWithGoogle(email){
    const u = DB.first('users', x => x.active && x.email && x.email.toLowerCase() === String(email).trim().toLowerCase());
    if(!u) return { ok:false, msg:`No account is linked to ${email}. Ask the office to add this Google email to your account in Users.` };
    this.user = u;
    try{ localStorage.setItem(SKEY, JSON.stringify({ userId:u.id, at:Date.now() })); }catch(e){}
    return { ok:true, user:u };
  },
  logout(){ this.user=null; try{ localStorage.removeItem(SKEY); }catch(e){} navigate('/'); },
  is(role){ return this.user?.role === role; },
  home(){ return this.user ? `/${this.user.role}/dashboard` : '/login'; }
};

/* ---- Google Sign-In ---------------------------------------------------
   Uses Google Identity Services (GIS) when a Client ID is configured in
   Admin → Settings AND the GIS script can actually load — it is blocked by
   this hosting environment's content-security policy, and Google does not
   support its button running inside a cross-origin iframe, so this will not
   work in the claude.ai artifact preview. It works once the file is hosted
   on a real domain that is registered as an authorized origin for the
   Client ID (see the setup guide). Either way, a clearly-labelled demo
   picker below lets you click through the same match-by-email flow now.

   decodeGoogleJWT only reads the token's payload — it does NOT verify the
   cryptographic signature. That check has to happen on a server (Google's
   tokeninfo endpoint, or a library such as google-auth-library); trusting
   an unverified token in the browser is exactly the same demo-only shortcut
   this file already takes with password hashing — never do this in production. */
function decodeGoogleJWT(token){
  try{
    const payload = token.split('.')[1];
    const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/'))
      .split('').map(c => '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}
function openGoogleDemoPicker(onProfile){
  const users = DB.where('users', u => u.active && u.email);
  openModal({ title:'Continue with Google (demo)',
    body: users.length ? `<p class="small muted" style="margin-bottom:12px">No live Google account is reachable right now, so pick one of the
        demo accounts below — each already has a Google email linked to it in Users — to see how sign-in matching works.</p>
      <div class="stack" style="gap:8px">${users.map(u=>`<button type="button" class="btn" data-gpick="${u.id}"
        style="width:100%;justify-content:flex-start;text-align:left;gap:10px">${avatar(u.name,28)}
        <span>${esc(u.name)}<div class="small muted">${esc(u.email)}</div></span></button>`).join('')}</div>`
      : `<p class="small muted">No demo accounts have a Google email set yet — add one from Admin → Users.</p>`,
    footer:`<button class="btn" data-close10>Cancel</button>`,
    onMount(m){
      m.querySelector('[data-close10]').onclick = closeModal;
      m.querySelectorAll('[data-gpick]').forEach(b => b.onclick = () => {
        const u = DB.get('users', b.dataset.gpick); closeModal();
        onProfile({ email:u.email, name:u.name });
      });
    }});
}
function renderGoogleSignIn(hostSel, onProfile){
  const host = $(hostSel); if(!host) return;
  const clientId = (S.settings().googleClientId||'').trim();
  const showDemo = note => {
    host.innerHTML = `<button type="button" class="btn" id="gsi-demo" style="width:100%;justify-content:center;gap:8px">
      <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16.3 3 9.6 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.4 26.9 37 24 37c-5.3 0-9.8-3.4-11.4-8.1l-6.6 5.1C9.5 40.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 2.9-2.9 5.3-5.3 6.9l6.6 5.4C39.7 37.3 43 31.4 43 24c0-1.4-.1-2.4-.4-3.5z"/></svg>
      Continue with Google</button>
      <p class="small muted" style="margin-top:8px">${esc(note)}</p>`;
    $('#gsi-demo').onclick = () => openGoogleDemoPicker(onProfile);
  };
  if(!clientId){ showDemo('Demo mode — no Google Client ID is configured yet (Admin → Settings → Google Sign-In).'); return; }
  const init = () => {
    try{
      window.google.accounts.id.initialize({ client_id:clientId, callback(resp){
        const profile = decodeGoogleJWT(resp.credential);
        if(!profile){ toast('Could not read that Google account.','err'); return; }
        onProfile(profile);
      }});
      host.innerHTML = '';
      window.google.accounts.id.renderButton(host, { theme:'outline', size:'large', width:320, text:'continue_with' });
    }catch(e){ showDemo('Google Sign-In could not start here — showing the demo sign-in instead.'); }
  };
  if(window.google?.accounts?.id){ init(); return; }
  const timer = setTimeout(() => showDemo('Could not reach Google from this environment — showing the demo sign-in instead.'), 2500);
  let script = document.querySelector('script[data-gsi]');
  if(!script){
    script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client'; script.async = true; script.defer = true; script.dataset.gsi = '1';
    document.head.appendChild(script);
  }
  script.addEventListener('load', () => { clearTimeout(timer); init(); });
  script.addEventListener('error', () => { clearTimeout(timer); showDemo('Could not reach Google from this environment — showing the demo sign-in instead.'); });
}

   ============================================================ */
const VIEWS = {};
const view = (path, fn, role) => VIEWS[path] = { fn, role };
const navigate = p => { location.hash = '#' + (p.startsWith('/')?p:'/'+p); };
function currentRoute(){
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  return { path: path || '', q: new URLSearchParams(qs || '') };
}
function guard(path){
  const need = path.startsWith('admin/') ? 'admin' : path.startsWith('teacher/') ? 'teacher'
             : path.startsWith('student/') ? 'student' : null;
  if(!need) return true;
  if(!Auth.user){ toast('Please sign in to continue.','warn'); navigate('/login?next='+encodeURIComponent(path)); return false; }
  if(Auth.user.role !== need){ toast('Your account does not have access to that area.','err'); navigate(Auth.home()); return false; }
  return true;
}
let _scrollLock = false;
async function render(){
  const { path, q } = currentRoute();
  if(!guard(path)) return;
  const v = VIEWS[path] || VIEWS[path.replace(/\/$/,'')] || null;
  const host = $('#app');
  if(!v){ host.innerHTML = publicShell(`<div class="page" style="text-align:center;padding:80px 20px">
      <h1>Page not found</h1><p class="muted">The link you followed does not exist.</p>
      <a class="btn btn-primary" href="#/">Back to the homepage</a></div>`); return; }
  closeMenus();
  host.innerHTML = '<div style="padding:60px;text-align:center" class="muted">Loading…</div>';
  const out = await v.fn(q);
  host.innerHTML = out.html !== undefined ? out.html : out;
  if(out.mount) out.mount();
  if(!_scrollLock) window.scrollTo(0,0);
  _scrollLock = false;
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#/' + path));
}
window.addEventListener('hashchange', render);

/* --- declarative form builder ------------------------------- */
function fieldHTML(f, val){
  const v = val ?? f.value ?? '';
  const req = f.required ? 'required' : '';
  const cls = 'field ' + (f.full ? 'full' : '');
  const lbl = `<label for="f_${f.name}">${esc(f.label)}${f.required?' <span class="err">*</span>':''}</label>`;
  let input;
  switch(f.type){
    case 'select':
      input = `<select id="f_${f.name}" name="${f.name}" ${req}>
        ${f.placeholder?`<option value="">${esc(f.placeholder)}</option>`:''}
        ${f.options.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(v)?'selected':''}>${esc(o.l)}</option>`).join('')}
      </select>`; break;
    case 'textarea': input = `<textarea id="f_${f.name}" name="${f.name}" ${req} rows="${f.rows||4}" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`; break;
    case 'checkbox': return `<div class="${cls}"><label class="check"><input type="checkbox" id="f_${f.name}" name="${f.name}" ${v?'checked':''}> ${esc(f.label)}</label>${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
    case 'file': input = `<input type="file" id="f_${f.name}" name="${f.name}" ${f.accept?`accept="${f.accept}"`:''}>`; break;
    case 'static': return `<div class="${cls}">${lbl}<div style="padding:8px 0;font-weight:600">${f.html||esc(v)}</div></div>`;
    default: input = `<input type="${f.type||'text'}" id="f_${f.name}" name="${f.name}" value="${esc(v)}" ${req}
      ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.step?`step="${f.step}"`:''}
      placeholder="${esc(f.placeholder||'')}">`;
  }
  return `<div class="${cls}">${lbl}${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
}
function readForm(form, fields){
  const out = {};
  fields.forEach(f => {
    if(f.type==='static') return;
    const el = form.elements[f.name]; if(!el) return;
    if(f.type==='checkbox') out[f.name] = el.checked;
    else if(f.type==='file') out[f.name] = el.files?.[0]?.name || '';
    else if(f.type==='number') out[f.name] = el.value==='' ? null : Number(el.value);
    else out[f.name] = el.value.trim();
  });
  return out;
}
function formModal({title, fields, values={}, submitLabel='Save', size='', intro='', onSubmit}){
  const body = `${intro?`<p class="muted small">${esc(intro)}</p>`:''}
    <form id="mform" novalidate><div class="form-grid">${fields.map(f=>fieldHTML(f, values[f.name])).join('')}</div></form>`;
  openModal({ title, size, body,
    footer:`<button class="btn" data-cancel>Cancel</button><button class="btn btn-primary" data-save>${esc(submitLabel)}</button>`,
    onMount(m){
      const form = m.querySelector('#mform');
      m.querySelector('[data-cancel]').onclick = closeModal;
      const submit = async () => {
        const missing = fields.filter(f => f.required && f.type!=='static' &&
          !(form.elements[f.name] && String(form.elements[f.name].value||'').trim()));
        if(missing.length){ toast(`${missing[0].label} is needed before this can be saved.`,'err');
          form.elements[missing[0].name]?.focus(); return; }
        const data = readForm(form, fields);
        const btn = m.querySelector('[data-save]'); btn.disabled = true; btn.textContent = 'Saving…';
        try{ await onSubmit(data); }finally{ btn.disabled=false; btn.textContent=submitLabel; }
      };
      m.querySelector('[data-save]').onclick = submit;
      form.onsubmit = e => { e.preventDefault(); submit(); };
    }});
}
/* --- data table with search, filters, sort, paging ---------- */
function dataTable(host, cfg){
  const st = { page:1, per:cfg.pageSize||10, q:'', sort:cfg.sort||null, dir:1, filters:{} };
  (cfg.filters||[]).forEach(f => st.filters[f.key] = f.value || '');
  function rows(){
    let r = cfg.rows();
    (cfg.filters||[]).forEach(f => { const v = st.filters[f.key]; if(v) r = r.filter(x => f.apply(x, v)); });
    if(st.q && cfg.search){ const q = st.q.toLowerCase(); r = r.filter(x => String(cfg.search(x)).toLowerCase().includes(q)); }
    if(st.sort){ const c = cfg.columns.find(c=>c.key===st.sort);
      r = [...r].sort((a,b) => { const av=c.sortVal?c.sortVal(a):a[st.sort], bv=c.sortVal?c.sortVal(b):b[st.sort];
        return (typeof av==='number'&&typeof bv==='number') ? (av-bv)*st.dir
          : String(av??'').localeCompare(String(bv??''),undefined,{numeric:true})*st.dir; }); }
    return r;
  }
  function draw(){
    const all = rows(), pages = Math.max(1, Math.ceil(all.length/st.per));
    st.page = clamp(st.page, 1, pages);
    const page = all.slice((st.page-1)*st.per, st.page*st.per);
    host.innerHTML = `
      <div class="toolbar">
        ${cfg.search?`<label class="gsearch" style="max-width:260px"><span class="mag" aria-hidden="true">⌕</span>
          <input type="search" placeholder="${esc(cfg.searchLabel||'Search')}" value="${esc(st.q)}" data-q aria-label="Search this table"></label>`:''}
        ${(cfg.filters||[]).map(f=>`<select data-f="${f.key}" aria-label="${esc(f.label)}">
          <option value="">${esc(f.label)}</option>
          ${f.options().map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(st.filters[f.key])?'selected':''}>${esc(o.l)}</option>`).join('')}
        </select>`).join('')}
        ${cfg.toolbar||''}
        <span style="flex:1"></span>
        <span class="small muted nowrap">${all.length} ${all.length===1?(cfg.unit||'record'):(cfg.units||(cfg.unit||'record')+'s')}</span>
        ${cfg.exportName?`<button class="btn btn-sm" data-csv>Export CSV</button><button class="btn btn-sm" data-pdf>Export PDF</button>`:''}
      </div>
      <div class="table-wrap"><table class="dt"><thead><tr>
        ${cfg.columns.map(c=>`<th ${c.sortable!==false?`data-s="${c.key}" style="cursor:pointer"`:''}>${esc(c.label)}${st.sort===c.key?(st.dir>0?' ▲':' ▼'):''}</th>`).join('')}
      </tr></thead><tbody>
        ${page.length ? page.map(r=>`<tr data-row="${esc(r.id)}">${cfg.columns.map(c=>`<td>${c.render?c.render(r):esc(r[c.key]??'—')}</td>`).join('')}</tr>`).join('')
          : `<tr><td colspan="${cfg.columns.length}"><div class="empty"><h4>${esc(cfg.emptyTitle||'Nothing here yet')}</h4><p class="small">${esc(cfg.emptyText||'Records you add will appear in this list.')}</p></div></td></tr>`}
      </tbody></table></div>
      ${pages>1?`<div class="pager"><span class="small muted">Page ${st.page} of ${pages}</span>
        <span class="btn-row"><button class="btn btn-sm" data-prev ${st.page===1?'disabled':''}>Previous</button>
        <button class="btn btn-sm" data-next ${st.page===pages?'disabled':''}>Next</button></span></div>`:''}`;
    const qEl = host.querySelector('[data-q]');
    if(qEl) qEl.oninput = debounce(e => { st.q = e.target.value; st.page=1; draw();
      const n = host.querySelector('[data-q]'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } });
    host.querySelectorAll('[data-f]').forEach(s => s.onchange = e => { st.filters[e.target.dataset.f]=e.target.value; st.page=1; draw(); });
    host.querySelectorAll('[data-s]').forEach(th => th.onclick = () => {
      const k = th.dataset.s; if(st.sort===k) st.dir*=-1; else { st.sort=k; st.dir=1; } draw(); });
    const p = host.querySelector('[data-prev]'), n = host.querySelector('[data-next]');
    if(p) p.onclick = ()=>{ st.page--; draw(); };
    if(n) n.onclick = ()=>{ st.page++; draw(); };
    const csv = host.querySelector('[data-csv]'), pdf = host.querySelector('[data-pdf]');
    const flat = () => ({ cols: cfg.columns.filter(c=>c.key!=='actions'),
      data: rows().map(r => cfg.columns.filter(c=>c.key!=='actions').map(c => c.text ? c.text(r) : String(r[c.key]??''))) });
    if(csv) csv.onclick = () => { const f=flat(); exportCSV(cfg.exportName, f.cols.map(c=>c.label), f.data); };
    if(pdf) pdf.onclick = () => { const f=flat(); exportPDF(cfg.exportName, cfg.exportTitle||cfg.exportName, f.cols.map(c=>c.label), f.data); };
    if(cfg.onDraw) cfg.onDraw(host);
  }
  draw();
  return { refresh: draw };
}

function chartBar(items, {h=190, color='var(--brand)', fmt=(v=>v), max=null}={}){
  if(!items.length) return `<div class="empty small">No data for this period.</div>`;
  const top = max ?? Math.max(1, ...items.map(i=>i.value));
  const bw = 100/items.length;
  return `<svg viewBox="0 0 100 ${h*0.36}" preserveAspectRatio="none" style="width:100%;height:${h}px" role="img" aria-label="Bar chart">
    ${[0.25,0.5,0.75,1].map(g=>`<line x1="0" x2="100" y1="${(h*0.30)*(1-g)+2}" y2="${(h*0.30)*(1-g)+2}" stroke="var(--line)" stroke-width=".3"/>`).join('')}
    ${items.map((it,i)=>{ const bh = (it.value/top)*(h*0.30); 
      return `<rect x="${i*bw+bw*0.22}" y="${h*0.30-bh+2}" width="${bw*0.56}" height="${Math.max(bh,0.4)}"
        fill="${it.color||color}" rx="0.6"><title>${esc(it.label)}: ${esc(fmt(it.value))}</title></rect>`; }).join('')}
  </svg>
  <div style="display:grid;grid-template-columns:repeat(${items.length},1fr);gap:2px;margin-top:6px">
    ${items.map(i=>`<div class="small muted" style="text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.68rem">${esc(i.label)}</div>`).join('')}
  </div>`;
}
function chartLine(items, {h=190, color='var(--green)', fmt=(v=>v)}={}){
  if(items.length<2) return `<div class="empty small">Not enough data yet.</div>`;
  const vals = items.map(i=>i.value), max = Math.max(...vals), min = Math.min(...vals);
  const span = Math.max(1, max-min), H = h*0.30;
  const pt = i => [ (i/(items.length-1))*100, H - ((items[i].value-min)/span)*(H-4) + 2 ];
  const line = items.map((_,i)=>pt(i).join(',')).join(' ');
  return `<svg viewBox="0 0 100 ${h*0.36}" preserveAspectRatio="none" style="width:100%;height:${h}px" role="img" aria-label="Line chart">
    ${[0,0.5,1].map(g=>`<line x1="0" x2="100" y1="${H*g+2}" y2="${H*g+2}" stroke="var(--line)" stroke-width=".3"/>`).join('')}
    <polyline points="${line} 100,${H+2} 0,${H+2}" fill="${color}" opacity=".12" stroke="none"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1" vector-effect="non-scaling-stroke"/>
    ${items.map((it,i)=>{const [x,y]=pt(i); return `<circle cx="${x}" cy="${y}" r="1" fill="${color}"><title>${esc(it.label)}: ${esc(fmt(it.value))}</title></circle>`;}).join('')}
  </svg>
  <div class="spread small muted" style="margin-top:4px"><span>${esc(items[0].label)}</span><span>${esc(items[items.length-1].label)}</span></div>`;
}
function chartDonut(parts, {size=150, center=''}={}){
  const total = sum(parts.map(p=>p.value)) || 1;
  const R=54, C=2*Math.PI*R; let off=0;
  return `<div class="row" style="gap:20px;align-items:center">
    <svg viewBox="0 0 140 140" style="width:${size}px;height:${size}px;flex:0 0 ${size}px" role="img" aria-label="Donut chart">
      <g transform="rotate(-90 70 70)">
      ${parts.map(p=>{ const len=(p.value/total)*C; const el=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.color}"
          stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"><title>${esc(p.label)}: ${p.value}</title></circle>`;
        off+=len; return el; }).join('')}
      </g>
      ${center?`<text x="70" y="75" text-anchor="middle" font-size="20" font-family="Fraunces,serif" font-weight="600" fill="var(--ink)">${esc(center)}</text>`:''}
    </svg>
    <div class="stack" style="gap:7px">
      ${parts.map(p=>`<div class="row small" style="gap:8px"><span class="dot" style="color:${p.color}"></span>
        <span>${esc(p.label)}</span><b class="mono-num">${p.value}</b></div>`).join('')}
    </div></div>`;
}
/* --- attendance calendar ----------------------------------- */
function attendanceCalendar(year, month, map){
  const first = new Date(year, month, 1), days = new Date(year, month+1, 0).getDate();
  const lead = first.getDay();
  let cells = '';
  for(let i=0;i<lead;i++) cells += `<div class="d off"></div>`;
  for(let dnum=1; dnum<=days; dnum++){
    const key = `${year}-${pad(month+1,2)}-${pad(dnum,2)}`;
    const st = map[key];
    const cls = st==='present'?'P':st==='absent'?'A':st==='late'?'L':'';
    cells += `<div class="d ${cls} ${new Date(year,month,dnum).getDay()===0?'off':''}" title="${key}${st?' — '+st:''}">${dnum}</div>`;
  }
  return `<div class="cal"><div class="hd">S</div><div class="hd">M</div><div class="hd">T</div><div class="hd">W</div>
    <div class="hd">T</div><div class="hd">F</div><div class="hd">S</div>${cells}</div>
    <div class="legend"><span><i class="dot" style="color:var(--green)"></i>Present</span>
    <span><i class="dot" style="color:var(--red)"></i>Absent</span>
    <span><i class="dot" style="color:var(--gold)"></i>Late</span></div>`;
}

let _dl;

function csvCell(v){ const s = String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function toCSV(headers, rows){ return [headers.map(csvCell).join(','), ...rows.map(r=>r.map(csvCell).join(','))].join('\r\n'); }
function exportCSV(name, headers, rows){

/* --- minimal PDF writer ------------------------------------- */
const HW_W = { ' ':.28,'.':.28,',':.28,':':.28,';':.28,"'":.19,'"':.35,'-':.33,'(':.33,')':.33,'/':.28,'|':.26 };
function textWidth(s, size, bold){
  let w=0; for(const c of s){ w += HW_W[c] ?? (/[0-9]/.test(c) ? .556 : /[A-Z@#%&]/.test(c) ? .68 : /[iljt]/.test(c) ? .26 : .53); }
  return w * size * (bold?1.04:1);
}
const asciiOnly = s => String(s??'').replace(/₹/g,'Rs.').replace(/[–—]/g,'-').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7E]/g,'');
const pdfEsc = s => asciiOnly(s).replace(/([\\()])/g,'\\$1');
function PDFDoc(){
  const W=595.28, H=841.89; const pages=[]; let ops=null;
  const api = {
    W, H, M:40,
    page(){ ops=[]; pages.push(ops); return api; },
    text(x, y, str, o={}){ const size=o.size||10, bold=!!o.bold, s=pdfEsc(str);
      let tx = x;
      if(o.align==='right') tx = x - textWidth(asciiOnly(str), size, bold);
      if(o.align==='center') tx = x - textWidth(asciiOnly(str), size, bold)/2;
      const c = o.color||[0,0,0];
      ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${c.join(' ')} rg ${tx.toFixed(2)} ${(H-y).toFixed(2)} Td (${s}) Tj ET`);
      return api; },
    line(x1,y1,x2,y2,o={}){ const c=o.color||[.78,.83,.9];
      ops.push(`${c.join(' ')} RG ${(o.w||0.7)} w ${x1.toFixed(2)} ${(H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(H-y2).toFixed(2)} l S`); return api; },
    rect(x,y,w,h,o={}){ const c=o.color||[.96,.97,.99];
      ops.push(`${c.join(' ')} rg ${x.toFixed(2)} ${(H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); return api; },
    wrap(x,y,maxW,str,o={}){ const size=o.size||10, words=asciiOnly(str).split(/\s+/); let line='', yy=y;
      words.forEach(w=>{ const t = line?line+' '+w:w;
        if(textWidth(t,size,o.bold)>maxW){ api.text(x,yy,line,o); line=w; yy+=(o.lh||size*1.35); } else line=t; });
      if(line) api.text(x,yy,line,o);
      return yy+(o.lh||size*1.35); },
    build(){
      const objs=[]; const push = s => { objs.push(s); return objs.length; };
      const kids=[]; const contentIds=[];
      pages.forEach(p => contentIds.push(null));
      // object ids: 1 catalog, 2 pages, 3 F1, 4 F2, then per page: page obj + content obj
      let body=''; const offsets=[];
      const out = [];
      out.push(`1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n`);
      const pageIds = pages.map((_,i)=> 5 + i*2);
      out.push(`2 0 obj\n<</Type/Pages/Kids[${pageIds.map(i=>i+' 0 R').join(' ')}]/Count ${pages.length}>>\nendobj\n`);
      out.push(`3 0 obj\n<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>\nendobj\n`);
      out.push(`4 0 obj\n<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>\nendobj\n`);
      pages.forEach((p,i)=>{
        const pid = 5+i*2, cid = pid+1, stream = p.join('\n');
        out.push(`${pid} 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W.toFixed(2)} ${H.toFixed(2)}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${cid} 0 R>>\nendobj\n`);
        out.push(`${cid} 0 obj\n<</Length ${stream.length}>>\nstream\n${stream}\nendstream\nendobj\n`);
      });
      let pdf = '%PDF-1.4\n', pos = pdf.length; const xref=[];
      out.forEach(o => { xref.push(pos); pdf += o; pos += o.length; });
      const start = pos;
      pdf += `xref\n0 ${xref.length+1}\n0000000000 65535 f \n` +
        xref.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('') +
        `trailer\n<</Size ${xref.length+1}/Root 1 0 R>>\nstartxref\n${start}\n%%EOF`;
      const bytes = new Uint8Array(pdf.length);
      for(let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
      return new Blob([bytes], {type:'application/pdf'});
    }
  };
  return api.page();
}
function pdfHeader(doc, title, subtitle){
  const st = S.settings();
  doc.rect(0,0,doc.W,78,{color:[.11,.17,.30]});
  doc.text(doc.M, 32, st.schoolName, {size:17, bold:true, color:[1,1,1]});
  doc.text(doc.M, 48, asciiOnly(st.address), {size:8, color:[.78,.84,.94]});
  doc.text(doc.M, 60, `${st.phone}  |  ${st.email}  |  Academic year ${st.academicYear}`, {size:8, color:[.78,.84,.94]});
  doc.text(doc.W-doc.M, 32, title, {size:12, bold:true, align:'right', color:[.92,.72,.34]});
  if(subtitle) doc.text(doc.W-doc.M, 47, subtitle, {size:8, align:'right', color:[.86,.89,.95]});
  doc.text(doc.W-doc.M, 60, 'Generated '+fmtDate(today()), {size:7.5, align:'right', color:[.78,.84,.94]});
  return 104;
}
function pdfTable(doc, y, headers, rows, widths){
  const M = doc.M, avail = doc.W - M*2;
  const w = widths || headers.map(()=>avail/headers.length);
  const scale = avail / sum(w); const cw = w.map(x=>x*scale);
  const drawHead = (yy) => { doc.rect(M, yy-11, avail, 17, {color:[.93,.95,.98]});
    let x=M+4; headers.forEach((h,i)=>{ doc.text(x, yy, h, {size:8.5, bold:true}); x+=cw[i]; });
    return yy+16; };
  y = drawHead(y);
  rows.forEach((r,ri) => {
    if(y > doc.H-52){ doc.page(); y = pdfHeader(doc,'(continued)','') ; y = drawHead(y); }
    if(ri%2) doc.rect(M, y-10, avail, 15, {color:[.975,.981,.99]});
    let x=M+4;
    r.forEach((c,i)=>{ let s=asciiOnly(c); const maxw=cw[i]-8;
      while(textWidth(s,8.4)>maxw && s.length>3) s = s.slice(0,-2);
      if(s!==asciiOnly(c)) s+='…'.replace('…','..');
      doc.text(x, y, s, {size:8.4}); x+=cw[i]; });
    y += 15;
    doc.line(M, y-10, doc.W-M, y-10, {w:0.4});
  });
  return y;
}
function exportPDF(name, title, headers, rows, widths){
  const doc = PDFDoc();
  let y = pdfHeader(doc, title, `${rows.length} record${rows.length===1?'':'s'}`);
  y = pdfTable(doc, y, headers, rows, widths);
  doc.text(doc.M, doc.H-28, 'Sarswati Vidya Mandir — School Management System', {size:7.5, color:[.45,.5,.6]});
  saveFile(`${name}-${today()}.pdf`, doc.build(), null);
}

view('apply', () => {
  const classOpts = DB.all('classes').slice(0,9).map(c=>({v:c.name, l:'Class '+c.name}));
  ADM_FIELDS.student.find(f=>f.name==='applyingFor').options = classOpts;
  const sect = (legend, note, fields) => `<fieldset><legend>${esc(legend)}</legend>
    ${note?`<p class="small muted" style="margin:-4px 0 12px">${esc(note)}</p>`:''}
    <div class="form-grid">${fields.map(f=>fieldHTML(f)).join('')}</div></fieldset>`;
  return { html: publicShell(`<section class="sect" style="max-width:860px">
    <div class="sect-h"><h1>Admission application</h1>
      <p>Takes about ten minutes. Fields marked <span class="err">*</span> are required.
      You will get an application number on the next screen — note it down.</p></div>
    <div class="card"><div class="card-b"><form id="adm" novalidate>
      ${sect('Student information','', ADM_FIELDS.student)}
      ${sect('Parent and guardian','', ADM_FIELDS.parent)}
      ${sect('Documents','Upload a scan or a clear photograph. In this demonstration build only the file name is recorded — nothing leaves your device.', ADM_FIELDS.docs)}
      <label class="check" style="margin-bottom:16px"><input type="checkbox" id="declare">
        I confirm the information above is correct to the best of my knowledge.</label>
      <div class="btn-row"><button class="btn btn-primary" type="submit">Submit application</button>
        <a class="btn" href="#/admissions">Back</a></div>
    </form></div></div></section>`, 'admissions'),
    mount(){
      mountPublic();
      const form = $('#adm');
      form.onsubmit = e => {
        e.preventDefault();
        const all = [...ADM_FIELDS.student, ...ADM_FIELDS.parent, ...ADM_FIELDS.docs];
        const miss = all.filter(f => f.required && !(form.elements[f.name]?.value||'').trim());
        if(miss.length){ toast(`${miss[0].label} is required.`,'err'); form.elements[miss[0].name].focus();
          form.elements[miss[0].name].scrollIntoView({block:'center'}); return; }
        if(!$('#declare').checked){ toast('Please tick the declaration before submitting.','err'); return; }
        const data = readForm(form, all);
        const st = S.settings();

const Calc = {
  invoice: sid => DB.first('invoices', i => i.studentId === sid),
  paymentsOf: sid => DB.where('payments', p => p.studentId === sid && p.status === 'success'),
  paid: sid => sum(Calc.paymentsOf(sid).map(p => p.amount)),
  total: sid => Calc.invoice(sid)?.total || 0,
  pending: sid => Math.max(0, Calc.total(sid) - Calc.paid(sid)),
  feeStatus(sid){ const t=Calc.total(sid), p=Calc.paid(sid);
    return p<=0 ? 'unpaid' : p>=t ? 'paid' : 'partial'; },
  attendanceOf: (sid, from, to) => DB.where('attendance', a => a.studentId===sid && (!from||a.date>=from) && (!to||a.date<=to)),
  attendancePct(sid, from, to){ const r = Calc.attendanceOf(sid, from, to);
    if(!r.length) return null;
    return Math.round((r.filter(a=>a.status!=='absent').length / r.length)*1000)/10; },
  dayAttendance(date){ const r = DB.where('attendance', a => a.date===date);
    return { present:r.filter(a=>a.status==='present').length, absent:r.filter(a=>a.status==='absent').length,
             late:r.filter(a=>a.status==='late').length, total:r.length }; },
  teacherDay(date){ const r = DB.where('teacher_attendance', a => a.date===date);
    return { present:r.filter(a=>a.status==='present').length, absent:r.filter(a=>a.status==='absent').length,
             leave:r.filter(a=>a.status==='leave'||a.status==='half-day').length, total:r.length }; },
  collected: () => sum(DB.where('payments', p=>p.status==='success').map(p=>p.amount)),
  billed: () => sum(DB.all('invoices').map(i=>i.total)),
  examResult(examId, studentId){
    const ex = DB.get('exams', examId); if(!ex) return null;
    const ms = DB.where('marks', m => m.examId===examId && m.studentId===studentId);
    if(!ms.length) return null;
    const obtained = sum(ms.map(m=>m.marks)), max = ex.maxMarks * ex.subjectIds.length;
    const pct = Math.round((obtained/max)*1000)/10;
    const failed = ms.some(m => (m.marks / ex.maxMarks)*100 < PASS_PCT);
    return { obtained, max, pct, grade:gradeOf(pct), pass: !failed && pct>=PASS_PCT, marks:ms };
  },
  lastNDays(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(iso(d)); } return out; }
};
const statusBadge = s => {
  const map = { pending:'b-gold', 'under-review':'b-blue', approved:'b-green', rejected:'b-red', waitlisted:'b-maroon',
    active:'b-green', inactive:'b-red', paid:'b-green', partial:'b-gold', unpaid:'b-red',
    present:'b-green', absent:'b-red', late:'b-gold', 'half-day':'b-gold', leave:'b-blue',
    success:'b-green', failed:'b-red', submitted:'b-blue', completed:'b-green', overdue:'b-red', published:'b-green', draft:'b-gold' };
  const label = String(s).replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());
  return `<span class="badge ${map[s]||''}">${esc(label)}</span>`;
};

function buildInvoice(s){
  const items = DB.all('fee_heads').filter(h =>
    (h.appliesTo==='all' || (Array.isArray(h.appliesTo)&&h.appliesTo.includes(s.classId))) &&
    (!h.optional || s.transport)).map(h=>({headId:h.id, name:h.name, amount:h.amount}));
  return DB.insert('invoices', { studentId:s.id, academicYear:S.settings().academicYear, items,
    total:sum(items.map(i=>i.amount)), dueDate:`${S.settings().academicYear.slice(0,4)}-09-30`, createdAt:today() });
}

function studentFields(values){
  const classes = DB.all('classes').map(c=>({v:c.id,l:'Class '+c.name}));
  const divs = S.divisionsOf(values?.classId || classes[0]?.v).map(d=>({v:d.id,l:'Division '+d.name}));
  return [
    {name:'name', label:'Full name', required:true, full:true},
    {name:'classId', label:'Class', type:'select', required:true, options:classes},
    {name:'divisionId', label:'Division', type:'select', required:true,
      options: DB.all('divisions').map(d=>({v:d.id, l:'Class '+S.cls(d.classId)+' — Division '+d.name}))},
    {name:'rollNo', label:'Roll number', type:'number', required:true},
    {name:'dob', label:'Date of birth', type:'date', required:true},
    {name:'gender', label:'Gender', type:'select', required:true, options:[{v:'Male',l:'Male'},{v:'Female',l:'Female'},{v:'Other',l:'Other'}]},
    {name:'bloodGroup', label:'Blood group', type:'select', placeholder:'Select', options:BLOOD.map(b=>({v:b,l:b}))},
    {name:'address', label:'Address', type:'textarea', full:true},
    {name:'fatherName', label:"Father's name", required:true},
    {name:'motherName', label:"Mother's name"},
    {name:'phone', label:'Parent contact number', type:'tel', required:true},
    {name:'email', label:'Parent email', type:'email'},
    {name:'occupation', label:'Parent occupation'},
    {name:'transport', label:'Uses school transport', type:'checkbox'}
  ];
}
function studentValues(s){ const p = S.parentOf(s);
  return { ...s, fatherName:p.fatherName, motherName:p.motherName, phone:p.phone, email:p.email, occupation:p.occupation }; }

            ${pays.length?pays.map(pay=>`<div class="spread" style="border-bottom:1px solid var(--line);padding:8px 0">
              <div><b class="small">${money(pay.amount)}</b><div class="small muted">${esc(pay.receiptNo)} · ${esc(pay.method)} · ${fmtDate(pay.date)}</div></div>
              <button class="btn btn-sm" data-do="rcp-view" data-id="${pay.id}">Receipt</button></div>`).join('')
              :'<p class="muted small">No payments recorded yet.</p>'}</div></div>`,
        () => exams.length ? exams.map(ex => { const r = Calc.examResult(ex.id, s.id);
            return `<div class="card" style="margin-bottom:12px"><div class="card-h">
              <h3>${esc(ex.name)}</h3>${ex.published?statusBadge('published'):statusBadge('draft')}</div>
              <div class="card-b">${!r?'<p class="muted small">Marks have not been entered yet.</p>':
                `<div class="table-wrap"><table class="dt" style="min-width:0"><thead><tr><th>Subject</th><th>Marks</th><th>Out of</th></tr></thead>
                <tbody>${r.marks.map(mk=>`<tr><td>${esc(S.subj(mk.subjectId))}</td>
                  <td class="mono-num">${mk.marks}</td><td class="mono-num">${ex.maxMarks}</td></tr>`).join('')}
                  <tr><td><b>Total</b></td><td class="mono-num"><b>${r.obtained}</b></td><td class="mono-num">${r.max}</td></tr></tbody></table></div>
                <div class="row" style="margin-top:12px;gap:18px"><span>Percentage <b class="mono-num">${r.pct}%</b></span>
                  <span>Grade ${gradeBadge(r.grade)}</span><span>${r.pass?statusBadge('paid').replace('Paid','Pass'):'<span class="badge b-red">Fail</span>'}</span></div>`}
              </div></div>`; }).join('')
          : '<p class="muted">No examinations for this class yet.</p>'
      ];
      const show = i => { pane.innerHTML = panes[i]();
        m.querySelectorAll('#stabs button').forEach((b,j)=>b.classList.toggle('on', i===j)); };
      m.querySelectorAll('#stabs button').forEach(b => b.onclick = () => show(+b.dataset.tab));
      show(0);
    }});
}

function teacherPct(id){
  const r = DB.where('teacher_attendance', a=>a.teacherId===id);
  if(!r.length) return 0;
  return Math.round((r.filter(a=>a.status==='present'||a.status==='half-day').length / r.length)*100);
}
function openTeacher(id){
  const x = DB.get('teachers', id); if(!x) return;
  const att = DB.where('teacher_attendance', a=>a.teacherId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const map = {}; att.forEach(a => map[a.date] = a.status==='present'?'present':a.status==='absent'?'absent':'late');
  const now = new Date();
  const tt = DB.where('timetable', r=>r.teacherId===id);
  const leaves = DB.where('leaves', l=>l.teacherId===id);
  openModal({ title:`${x.name} — ${x.code}`, size:'wide',
    body:`<div class="grid g2">
      <div><div class="row" style="gap:14px;margin-bottom:14px">${avatar(x.name,58)}
          <div><h3 style="font-size:1.1rem">${esc(x.name)}</h3><span class="small muted">${esc(x.designation)}</span></div></div>
        <dl class="kv"><dt>Teacher ID</dt><dd>${esc(x.code)}</dd>
          <dt>Qualification</dt><dd>${esc(x.qualification)}</dd>
          <dt>Subjects</dt><dd>${x.subjectIds.map(S.subj).join(', ')||'—'}</dd>
          <dt>Phone</dt><dd>${esc(x.phone)}</dd><dt>Email</dt><dd>${esc(x.email)}</dd>
          <dt>Joined</dt><dd>${fmtDate(x.joiningDate)}</dd>
          <dt>Attendance</dt><dd>${teacherPct(id)}% of ${att.length} days</dd>
          <dt>Periods a week</dt><dd>${tt.length}</dd></dl>
        <h4 style="margin:16px 0 8px">Leave requests</h4>
        ${leaves.length?leaves.map(l=>`<div class="spread small" style="border-bottom:1px solid var(--line);padding:6px 0">
          <span>${fmtDate(l.from)} – ${fmtDate(l.to)} · ${esc(l.reason)}</span>${statusBadge(l.status)}</div>`).join('')
          :'<p class="muted small">None.</p>'}</div>
      <div><h4 style="margin-bottom:10px">${MONTHS[now.getMonth()]} ${now.getFullYear()}</h4>
        ${attendanceCalendar(now.getFullYear(), now.getMonth(), map)}
        <h4 style="margin:18px 0 8px">Teaching schedule</h4>
        <div class="table-wrap"><table class="dt" style="min-width:0"><thead><tr><th>Day</th><th>Period</th><th>Class</th><th>Subject</th></tr></thead>
        <tbody>${tt.slice(0,10).map(r=>`<tr><td>${esc(r.day.slice(0,3))}</td><td>${esc(r.period)}</td>
          <td>${esc(S.cls(r.classId))} ${esc(S.div(r.divisionId))}</td><td>${esc(S.subj(r.subjectId))}</td></tr>`).join('')
          || '<tr><td colspan="4" class="muted">No periods allotted.</td></tr>'}</tbody></table></div></div>
    </div>`,
    footer:`<button class="btn" data-close5>Close</button>`,
    onMount(m){ m.querySelector('[data-close5]').onclick = closeModal; }});
}

function attendanceSheetUI(hostId, opts={}){
  const classes = DB.all('classes').filter(c => !opts.classIds || opts.classIds.includes(c.id));
  const st = { classId: opts.classId || classes[0]?.id, divisionId:null, date: today() };
  st.divisionId = S.divisionsOf(st.classId)[0]?.id;
  const host = $('#'+hostId);
  function draw(){
    const students = sortBy(S.studentsOf(st.classId, st.divisionId), 'rollNo');
    const existing = {};
    DB.where('attendance', a => a.date===st.date && a.classId===st.classId && a.divisionId===st.divisionId)
      .forEach(a => existing[a.studentId] = a.status);
    const already = Object.keys(existing).length > 0;
    host.innerHTML = `
      <div class="toolbar">
        <select id="acls" aria-label="Class">${classes.map(c=>`<option value="${c.id}" ${c.id===st.classId?'selected':''}>Class ${esc(c.name)}</option>`).join('')}</select>
        <select id="adiv" aria-label="Division">${S.divisionsOf(st.classId).map(d=>`<option value="${d.id}" ${d.id===st.divisionId?'selected':''}>Division ${esc(d.name)}</option>`).join('')}</select>
        <input type="date" id="adate" value="${st.date}" max="${today()}" style="width:auto" aria-label="Date">
        <span style="flex:1"></span>
        <button class="btn btn-sm" id="allp">Mark all present</button>
        <button class="btn btn-sm" id="alla">Mark all absent</button>
      </div>
      ${already?`<div class="demo-banner">Attendance for this day is already saved. Changing it below will update the record.</div>`:''}
      <div class="table-wrap"><table class="dt"><thead><tr>
        <th style="width:70px">Roll</th><th>Student</th><th style="width:230px">Attendance</th></tr></thead>
        <tbody>${students.length?students.map(s=>{ const cur = existing[s.id]||'present';
          return `<tr data-s="${s.id}"><td class="mono-num"><b>${s.rollNo}</b></td>
            <td>${studentCell(s)}</td>
            <td><div class="actions">
              ${[['present','P','Present'],['absent','A','Absent'],['late','L','Late']].map(o=>
                `<button class="att-btn ${o[1]} ${cur===o[0]?'on':''}" data-v="${o[0]}">${o[2]}</button>`).join('')}
            </div></td></tr>`; }).join('')
          :`<tr><td colspan="3"><div class="empty"><h4>No students in this division</h4>
            <p class="small">Add students to Class ${esc(S.cls(st.classId))} before marking attendance.</p></div></td></tr>`}</tbody></table></div>
      <div class="pager"><span class="small muted" id="acount"></span>
        <button class="btn btn-primary" id="asave" ${students.length?'':'disabled'}>Save attendance</button></div>`;
    const count = () => {
      const p = host.querySelectorAll('.att-btn.P.on').length, a = host.querySelectorAll('.att-btn.A.on').length,
            l = host.querySelectorAll('.att-btn.L.on').length;
      $('#acount').textContent = `${p} present · ${a} absent · ${l} late`;
    };
    host.querySelectorAll('tbody tr').forEach(tr => tr.querySelectorAll('.att-btn').forEach(b => b.onclick = () => {
      tr.querySelectorAll('.att-btn').forEach(x=>x.classList.remove('on')); b.classList.add('on'); count(); }));
    $('#acls').onchange = e => { st.classId = e.target.value; st.divisionId = S.divisionsOf(st.classId)[0]?.id; draw(); };
    $('#adiv').onchange = e => { st.divisionId = e.target.value; draw(); };
    $('#adate').onchange = e => { st.date = e.target.value; draw(); };
    $('#allp').onclick = () => { host.querySelectorAll('tbody tr').forEach(tr => {
      tr.querySelectorAll('.att-btn').forEach(x=>x.classList.remove('on')); tr.querySelector('.att-btn.P').classList.add('on'); }); count(); };
    $('#alla').onclick = () => { host.querySelectorAll('tbody tr').forEach(tr => {
      tr.querySelectorAll('.att-btn').forEach(x=>x.classList.remove('on')); tr.querySelector('.att-btn.A').classList.add('on'); }); count(); };
    const save = $('#asave');
    if(save) save.onclick = () => {
      let n = 0;
      host.querySelectorAll('tbody tr[data-s]').forEach(tr => {
        const sid = tr.dataset.s, on = tr.querySelector('.att-btn.on');
        const status = on ? on.dataset.v : 'present';
        DB.upsert('attendance', a => a.date===st.date && a.studentId===sid,
          { date:st.date, studentId:sid, classId:st.classId, divisionId:st.divisionId, status,
            markedBy: Auth.user.linkedId || 'admin' });
        n++;
      });
      const absents = host.querySelectorAll('.att-btn.A.on').length;
      if(absents) DB.insert('notifications', { role:'admin', type:'attendance',
        text:`${absents} student${absents===1?'':'s'} absent in Class ${S.cls(st.classId)} ${S.div(st.divisionId)} on ${fmtDate(st.date)}.`,
        date:today(), read:false });
      toast(`Attendance saved successfully for ${n} students.`);
      draw();
    };
    count();
  }
  draw();
}
