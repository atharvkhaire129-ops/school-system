function monthlyAttendanceUI(hostId){
  const host = $('#'+hostId);
  const now = new Date();
  const st = { classId: DB.all('classes')[0].id, month: now.getMonth(), year: now.getFullYear() };
  function draw(){
    const students = sortBy(S.studentsOf(st.classId), 'rollNo');
    const from = `${st.year}-${pad(st.month+1,2)}-01`, to = `${st.year}-${pad(st.month+1,2)}-31`;
    const rows = students.map(s => {
      const r = Calc.attendanceOf(s.id, from, to);
      return { s, present:r.filter(x=>x.status==='present').length, late:r.filter(x=>x.status==='late').length,
        absent:r.filter(x=>x.status==='absent').length, total:r.length,
        pct: r.length ? Math.round(((r.length - r.filter(x=>x.status==='absent').length)/r.length)*100) : 0 };
    });
    host.innerHTML = `<div class="toolbar">
        <select id="mcls" aria-label="Class">${DB.all('classes').map(c=>`<option value="${c.id}" ${c.id===st.classId?'selected':''}>Class ${esc(c.name)}</option>`).join('')}</select>
        <select id="mmon" aria-label="Month">${MONTHS.map((m,i)=>`<option value="${i}" ${i===st.month?'selected':''}>${m}</option>`).join('')}</select>
        <select id="myr" aria-label="Year">${[st.year-1, st.year].map(y=>`<option value="${y}" ${y===st.year?'selected':''}>${y}</option>`).join('')}</select>
        <span style="flex:1"></span>
        <button class="btn btn-sm" id="mcsv">Export CSV</button><button class="btn btn-sm" id="mpdf">Export PDF</button></div>
      <div class="table-wrap"><table class="dt"><thead><tr><th>Roll</th><th>Student</th><th>Present</th><th>Late</th>
        <th>Absent</th><th>Marked days</th><th>Percentage</th></tr></thead>
      <tbody>${rows.length?rows.map(r=>`<tr><td class="mono-num">${r.s.rollNo}</td><td>${studentCell(r.s)}</td>
        <td class="mono-num">${r.present}</td><td class="mono-num">${r.late}</td><td class="mono-num">${r.absent}</td>
        <td class="mono-num">${r.total}</td>
        <td><b class="mono-num">${r.pct}%</b><div class="prog" style="margin-top:4px;width:70px"><i style="width:${r.pct}%;background:${r.pct<75?'var(--red)':'var(--green)'}"></i></div></td></tr>`).join('')
        :`<tr><td colspan="7"><div class="empty"><h4>Nothing marked this month</h4><p class="small">Pick another month or mark attendance first.</p></div></td></tr>`}</tbody></table></div>`;
    $('#mcls').onchange = e => { st.classId = e.target.value; draw(); };
    $('#mmon').onchange = e => { st.month = +e.target.value; draw(); };
    $('#myr').onchange = e => { st.year = +e.target.value; draw(); };
    const headers = ['Roll','Student','Student ID','Present','Late','Absent','Marked days','Percentage'];
    const data = () => rows.map(r=>[r.s.rollNo, r.s.name, r.s.code, r.present, r.late, r.absent, r.total, r.pct+'%']);
    $('#mcsv').onclick = () => exportCSV(`attendance-${S.cls(st.classId)}-${MONTHS[st.month]}`, headers, data());
    $('#mpdf').onclick = () => exportPDF(`attendance-${S.cls(st.classId)}-${MONTHS[st.month]}`,
      `Attendance — Class ${S.cls(st.classId)}, ${MONTHS[st.month]} ${st.year}`, headers, data(), [6,22,14,10,8,9,12,12]);
  }
  draw();
}

function collectPayment(studentId, after){
  const s = DB.get('students', studentId);
  const pending = Calc.pending(studentId);
  if(pending <= 0){ toast(`${s.name} has no pending fee.`,'warn'); return; }
  formModal({ title:'Record a payment — '+s.name, submitLabel:'Record payment',
    intro:`Pending amount ${money(pending)}. A receipt is generated as soon as the payment is recorded.`,
    fields:[
      {name:'amount', label:'Amount received', type:'number', required:true, min:1, max:pending, value:pending},
      {name:'method', label:'Payment method', type:'select', required:true,
        options:['Cash','UPI','Cheque','Net Banking','Card','Demand Draft'].map(v=>({v,l:v}))},
      {name:'date', label:'Payment date', type:'date', required:true, value:today()},
      {name:'note', label:'Remark', full:true, placeholder:'Instalment, cheque number, etc.'}
    ],
    onSubmit(d){
      if(d.amount > pending){ toast(`That is more than the pending ${money(pending)}.`,'err'); return; }
      const pay = recordPayment(studentId, d.amount, d.method, d.note, d.date);
      closeModal(); if(after) after();
      toast(`Payment successful. Receipt ${pay.receiptNo} generated.`);
      showReceipt(pay.id);
    }});
}
/* Payment abstraction — swap `gateway` for a real provider.
   A production build must create the order on the SERVER, verify
   the signature on the SERVER, and never touch card or UPI data here. */
const PaymentGateway = {
  name: 'demo-gateway',
  async charge({ amount, studentId, method }){
    await new Promise(r => setTimeout(r, 900));           // stands in for the network round trip
    const ok = Math.random() > 0.08;                      // a real gateway decides this; demo fails ~8% of attempts
    return { status: ok ? 'success' : 'failed',
      txnId: 'TXN-' + Date.now().toString(36).toUpperCase().slice(-8),
      amount, studentId, method, at: new Date().toISOString() };
  }
};
function recordPayment(studentId, amount, method, note, date, txnId, status){
  const inv = Calc.invoice(studentId);
  const receiptNo = DB.seq('payments','RCP-'+S.settings().academicYear.slice(0,4)+'-',4);
  const pay = DB.insert('payments', { invoiceId: inv?.id, studentId, amount:Number(amount), method,
    date: date||today(), txnId: txnId || ('TXN-'+Date.now().toString(36).toUpperCase().slice(-8)),
    receiptNo, status: status||'success', note: note||'' });
  DB.insert('notifications', { role:'admin', type:'payment',
    text:`Payment received — ${moneyPlain(amount)} from ${S.student(studentId)} (${receiptNo}).`, date:today(), read:false });
  DB.insert('notifications', { role:'student', type:'payment',
    text:`Payment of ${moneyPlain(amount)} received. Receipt ${receiptNo}.`, date:today(), read:false });
  return pay;
}

function receiptPDF(pay){
  const s = DB.get('students', pay.studentId), inv = Calc.invoice(pay.studentId), st = S.settings();
  const doc = PDFDoc();
  let y = pdfHeader(doc, 'FEE RECEIPT', 'No. ' + pay.receiptNo);
  const M = doc.M;
  const pairs = [['Student name', s?.name||'—'], ['Student ID', s?.code||'—'],
    ['Class', S.classFull(s?.classId, s?.divisionId) + '  ·  roll ' + (s?.rollNo??'—')],
    ['Academic year', inv?.academicYear || st.academicYear],
    ['Payment date', fmtDate(pay.date)], ['Payment method', pay.method],
    ['Transaction ID', pay.txnId], ['Status', pay.status]];
  pairs.forEach((p,i) => { const col = i%2, row = Math.floor(i/2);
    const x = M + col*((doc.W-M*2)/2);
    doc.text(x, y + row*17, p[0], {size:8, color:[.42,.47,.57]});
    doc.text(x, y + row*17 + 10, String(p[1]), {size:9.5, bold:true}); });
  y += Math.ceil(pairs.length/2)*17 + 14;
  doc.line(M, y-6, doc.W-M, y-6);
  y = pdfTable(doc, y+8, ['Fee particulars','Amount'],
    [...(inv?.items||[]).map(i=>[i.name, moneyPlain(i.amount)]), ['Total fee for the year', moneyPlain(inv?.total||0)]], [70,30]);
  y += 14;
  const line = (l,v,bold) => { doc.text(M, y, l, {size:10, bold}); doc.text(doc.W-M, y, v, {size:10, bold, align:'right'}); y+=17; };
  line('Amount paid now', moneyPlain(pay.amount), true);
  line('Total paid to date', moneyPlain(Calc.paid(pay.studentId)));
  line('Remaining balance', moneyPlain(Calc.pending(pay.studentId)), true);
  if(pay.note) doc.text(M, y+6, 'Remark: ' + pay.note, {size:8.5, color:[.42,.47,.57]});
  doc.text(M, doc.H-60, asciiOnly(st.receiptNote), {size:8, color:[.42,.47,.57]});
  doc.line(doc.W-M-150, doc.H-70, doc.W-M, doc.H-70);
  doc.text(doc.W-M, doc.H-58, 'Authorised signatory', {size:8.5, align:'right'});
  return doc.build();
}

function marksProgress(ex){
  const students = S.studentsOf(ex.classId);
  const need = students.length * ex.subjectIds.length;

  return Math.round(DB.where('marks', m=>m.examId===ex.id).length / need * 100);
}

      <button class="btn btn-primary" data-save2>Save marks</button>`,
    onMount(m){
      m.querySelector('[data-close7]').onclick = closeModal;
      m.querySelector('[data-save2]').onclick = () => {
        let n = 0, bad = 0;
        m.querySelectorAll('input[data-s]').forEach(inp => {
          const v = inp.value.trim();
          const match = x => x.examId===examId && x.studentId===inp.dataset.s && x.subjectId===inp.dataset.sub;
          if(v === ''){ const ex2 = DB.first('marks', match); if(ex2) DB.remove('marks', ex2.id); return; }
          const num = Number(v);
          if(isNaN(num) || num < 0 || num > ex.maxMarks){ bad++; inp.style.borderColor='var(--red)'; return; }
          DB.upsert('marks', match, { examId, studentId:inp.dataset.s, subjectId:inp.dataset.sub, marks:num }); n++;
        });
        if(bad){ toast(`${bad} mark${bad===1?'':'s'} outside 0–${ex.maxMarks} were not saved.`,'err'); return; }
        toast(`Marks saved successfully for ${students.length} students.`); closeModal(); after();
      };
      m.querySelector('[data-pub]').onclick = () => {
        const now = !ex.published;
        DB.update('exams', examId, { published: now });
        if(now) DB.insert('notifications', { role:'student', type:'result',
          text:`${ex.name} result published for Class ${S.cls(ex.classId)}.`, date:today(), read:false });
        toast(now?'Result published. Students can see it now.':'Result unpublished.');
        closeModal(); after();
      };
    }});
}

const WEEKDAYS = DAYS.slice(1);
function timetableGrid(classId, divisionId, {editable=false, teacherId=null}={}){
  const rows = teacherId ? DB.where('timetable', r=>r.teacherId===teacherId)
    : DB.where('timetable', r=>r.classId===classId && r.divisionId===divisionId);
  const periods = [];
  rows.forEach(r => { if(!periods.find(p=>p.period===r.period)) periods.push({period:r.period, time:r.time}); });
  periods.sort((a,b)=>a.time.localeCompare(b.time));
  if(!rows.length) return `<div class="empty"><h4>No timetable yet</h4>
    <p class="small">${editable?'Use “Generate a timetable” to create one for this division.':'The office has not published a timetable for this class.'}</p></div>`;
  const cell = (day, period) => {
    const r = rows.find(x=>x.day===day && x.period===period);
    if(!r) return '<td class="muted">—</td>';
    if(r.isBreak) return `<td class="muted small" style="background:var(--surface-2)">Break</td>`;
    return `<td class="tt-cell" ${editable?`data-do="tt-edit" data-id="${r.id}" style="cursor:pointer"`:''}>
      ${esc(teacherId ? S.cls(r.classId)+' '+S.div(r.divisionId) : S.subj(r.subjectId))}
      <small>${esc(teacherId ? S.subj(r.subjectId) : S.teacher(r.teacherId))} · ${esc(r.room)}</small></td>`;
  };
  return `<div class="table-wrap"><table class="dt timetable"><thead><tr><th>Time</th>
    ${WEEKDAYS.map(d=>`<th>${esc(d)}</th>`).join('')}</tr></thead>
    <tbody>${periods.map(p=>`<tr><td class="nowrap"><b>${esc(p.period)}</b><br><span class="small muted">${esc(p.time)}</span></td>
      ${WEEKDAYS.map(d=>cell(d,p.period)).join('')}</tr>`).join('')}</tbody></table></div>`;
}
view('admin/timetable', () => {
  const classes = DB.all('classes');
  const html = appShell('admin/timetable','Timetable','Class-wise weekly schedule', `
    <div class="card"><div class="toolbar">
      <select id="tcls" aria-label="Class">${classes.map(c=>`<option value="${c.id}">Class ${esc(c.name)}</option>`).join('')}</select>
      <select id="tdiv" aria-label="Division"></select>
      <span style="flex:1"></span>
      <span class="small muted">Tap any period to change it</span>
      <button class="btn btn-sm btn-primary" id="tgen">Generate a timetable</button></div>
      <div id="tgrid"></div></div>`);
  return { html, mount(){
    mountShell();
    const st = { classId: classes[0].id, divisionId:null };
    function divs(){
      const ds = S.divisionsOf(st.classId);
      st.divisionId = ds[0]?.id;
      $('#tdiv').innerHTML = ds.map(d=>`<option value="${d.id}">Division ${esc(d.name)}</option>`).join('');
    }
    function draw(){ $('#tgrid').innerHTML = timetableGrid(st.classId, st.divisionId, {editable:true}); }
    $('#tcls').onchange = e => { st.classId = e.target.value; divs(); draw(); };
    $('#tdiv').onchange = e => { st.divisionId = e.target.value; draw(); };
    ACTIONS['tt-edit'] = id => {
      const r = DB.get('timetable', id);
      formModal({ title:`${r.day}, period ${r.period}`, submitLabel:'Save period',
        fields:[
          {name:'subjectId', label:'Subject', type:'select', required:true, full:true,
            options: DB.all('subjects').filter(s=>s.classIds.includes(r.classId)).map(s=>({v:s.id,l:s.name}))},
          {name:'teacherId', label:'Teacher', type:'select', required:true, full:true,
            options: DB.where('teachers',t=>t.status==='active').map(t=>({v:t.id,l:t.name}))},
          {name:'room', label:'Room number', required:true},
          {name:'time', label:'Time', required:true}
        ], values:r,
        onSubmit(d){ DB.update('timetable', id, d); closeModal(); draw(); toast('Timetable updated successfully.'); }});
    };
    $('#tgen').onclick = async () => {
      if(!await confirmDialog('Generate a timetable',
        `Replace the timetable for Class ${S.cls(st.classId)} ${S.div(st.divisionId)}? The current one is discarded.`,'Generate',false)) return;
      DB.where('timetable', r=>r.classId===st.classId && r.divisionId===st.divisionId).forEach(r=>DB.remove('timetable', r.id));
      const pool = DB.all('subjects').filter(s=>s.classIds.includes(st.classId));
      const P = [['1','7:30 – 8:15'],['2','8:15 – 9:00'],['3','9:00 – 9:45'],['B','9:45 – 10:05'],
        ['4','10:05 – 10:50'],['5','10:50 – 11:35'],['6','11:35 – 12:20'],['7','12:20 – 1:05']];
      WEEKDAYS.forEach((day, wi) => P.forEach((p, pi) => {
        if(p[0]==='B'){ DB.insert('timetable', { classId:st.classId, divisionId:st.divisionId, day, period:p[0],
          time:p[1], subjectId:null, teacherId:null, room:'—', isBreak:true }); return; }
        const sub = pool[(wi*3 + pi*2) % pool.length];
        const tch = DB.first('teachers', t=>t.subjectIds.includes(sub.id)) || DB.all('teachers')[pi%10];
        DB.insert('timetable', { classId:st.classId, divisionId:st.divisionId, day, period:p[0], time:p[1],
          subjectId:sub.id, teacherId:tch.id, room:'Room '+(100+DB.get('classes',st.classId).level*2) });
      }));
      draw(); toast('Timetable generated successfully.');
    };
    divs(); draw();
  }};
});

function teacherAssignments(teacherId){
  const rows = DB.where('timetable', r => r.teacherId===teacherId && !r.isBreak);
  const map = {};
  rows.forEach(r => {
    const key = r.classId+'|'+r.divisionId;
    if(!map[key]) map[key] = { classId:r.classId, divisionId:r.divisionId, subjectIds:[] };
    if(!map[key].subjectIds.includes(r.subjectId)) map[key].subjectIds.push(r.subjectId);
  });
  return sortBy(Object.values(map), 'classId');
}
function teacherStudents(teacherId){
  const seen = new Set(), out = [];
  teacherAssignments(teacherId).forEach(a => S.studentsOf(a.classId, a.divisionId).forEach(s => {
    if(!seen.has(s.id)){ seen.add(s.id); out.push(s); } }));
  return out;
}
function teacherExams(teacherId){
  const asg = teacherAssignments(teacherId);
  const classIds = new Set(asg.map(a=>a.classId));
  const subjIds = new Set(asg.flatMap(a=>a.subjectIds));
  return DB.all('exams').filter(e => classIds.has(e.classId) && e.subjectIds.some(s=>subjIds.has(s)));
}
function audienceNotices(role){
  return DB.all('notices').filter(n => n.audience.includes('all') || n.audience.includes(role))
    .sort((a,b) => (b.pinned-a.pinned) || b.date.localeCompare(a.date));
}

/* --- online payment (demo gateway; real cards/UPI never touch the frontend) --- */
function payOnline(studentId, after){
  const s = DB.get('students', studentId);
  const pending = Calc.pending(studentId);
  if(pending <= 0){ toast('You have no pending fee.','warn'); return; }
  formModal({ title:'Pay fees online', submitLabel:'Pay now',
    intro:`Pending amount ${money(pending)}. This demo does not collect real card, UPI or bank details — a production build would hand off to a licensed payment gateway on the server.`,
    fields:[
      {name:'amount', label:'Amount to pay', type:'number', required:true, min:1, max:pending, value:pending},
      {name:'method', label:'Payment method', type:'select', required:true,
        options:['Card','UPI','Net Banking'].map(v=>({v,l:v}))}
    ],
    async onSubmit(d){
      if(d.amount > pending){ toast(`That is more than the pending ${money(pending)}.`,'err'); return; }
      toast('Processing payment…','info', 1400);
      const res = await PaymentGateway.charge({ amount:d.amount, studentId, method:d.method });
      if(res.status === 'success'){
        const pay = recordPayment(studentId, d.amount, d.method, 'Paid online via demo gateway', today(), res.txnId, 'success');
        closeModal(); if(after) after();
        toast(`Payment successful. Receipt ${pay.receiptNo} generated.`);
        showReceipt(pay.id);
      }else{
        DB.insert('payments', { invoiceId: Calc.invoice(studentId)?.id, studentId, amount:Number(d.amount), method:d.method,
          date: today(), txnId: res.txnId, receiptNo: null, status:'failed', note:'Online payment failed — no amount was deducted.' });
        closeModal(); if(after) after();
        toast('Payment failed. No amount was deducted — please try again.','err');
      }
    }});
}

          `<button class="btn btn-sm btn-primary" data-do="hw-submit" data-id="${x.id}">Mark as submitted</button>`:'<span class="small muted">—</span>'}
      ]
    });
    ACTIONS['hw-submit'] = id => { DB.update('submissions', id, { status:'submitted', date:today() });
      t.refresh(); toast('Homework marked as submitted.'); };
  }};
});

view('student/timetable', () => {
  const s = currentStudent();
  const html = appShell('student/timetable','My timetable',`Class ${S.classFull(s.classId,s.divisionId)} weekly schedule`,
    `<div class="card">${timetableGrid(s.classId, s.divisionId)}</div>`);
  return { html, mount(){ mountShell(); }};
});

view('student/notices', () => {
  const notices = audienceNotices('student');
  const html = appShell('student/notices','Notices','Announcements from the school office', `
    <div class="stack" style="gap:12px">${notices.length?notices.map(n=>`<div class="card">
      <div class="card-h"><h3>${esc(n.title)}${n.pinned?' <span class="badge b-gold">pinned</span>':''}</h3>
        <span class="small muted">${fmtDate(n.date)}</span></div>
      <div class="card-b"><p class="small" style="margin:0">${esc(n.body)}</p></div></div>`).join('')
      :'<div class="empty"><h4>No notices yet</h4></div>'}</div>`);
  return { html, mount(){ mountShell(); }};
});

/* ============================================================
   27. ADMIN — SETTINGS
   ============================================================ */
view('admin/settings', () => {
  const st = S.settings();
  const section = (title, sub, id, fields, values) => `<div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>${esc(title)}</h3></div>
    <div class="card-b"><p class="small muted" style="margin:0 0 10px">${esc(sub)}</p>
      <div class="form-grid">${fields.map(f=>fieldHTML(f, values[f.name])).join('')}</div>
      <button class="btn btn-primary btn-sm" id="${id}save" style="margin-top:10px">Save changes</button></div></div>`;

  const html = appShell('admin/settings','Settings','School information, classes, subjects and demo data', `
    ${section('School identity','Shown on the public website and printed on fee receipts.', 'idset',
      [{name:'schoolName',label:'School name',required:true,full:true},
       {name:'nameDevanagari',label:'School name (Devanagari)',full:true},
       {name:'shortName',label:'Logo text',required:true,hint:'Shown wherever the crest or logo placeholder appears.'},
       {name:'tagline',label:'Tagline',full:true},
       {name:'established',label:'Established (year)'}], st)}
    ${section('Contact and academic year','Used across the public website, portals and receipts.', 'ctset',
      [{name:'address',label:'Address',full:true},
       {name:'phone',label:'Phone',type:'tel'}, {name:'email',label:'Email',type:'email'},
       {name:'timings',label:'School timings',full:true},
       {name:'academicYear',label:'Academic year',hint:'e.g. 2025-26'}], st)}
    ${section("About and principal's message",'Shown on the public About and Home pages.', 'abset',
      [{name:'principal',label:"Principal's name"},
       {name:'about',label:'About the school',type:'textarea',full:true,rows:4},
       {name:'principalMessage',label:"Principal's message",type:'textarea',full:true,rows:4}], st)}
    ${section('Homepage statistics','The counters shown on the public website home page.', 'stset',
      [{name:'statStudents',label:'Students'}, {name:'statTeachers',label:'Teachers'},
       {name:'statClasses',label:'Classes'}, {name:'statYears',label:'Years'}],
      {statStudents:st.stats.students, statTeachers:st.stats.teachers, statClasses:st.stats.classes, statYears:st.stats.years})}
    ${section('Fee receipt note','A line printed at the bottom of every fee receipt.', 'rcset',
      [{name:'receiptNote',label:'Receipt note',full:true}], st)}
    ${section('Google Sign-In','Lets people sign in with a Google account instead of a password, matched by the email you set on their account in Users. Needs a Client ID from a Google Cloud project with your live domain added as an authorized origin — until then, the login page shows a demo picker instead.', 'gset',
      [{name:'googleClientId',label:'Google OAuth Client ID',full:true,placeholder:'xxxxxxxxxx.apps.googleusercontent.com'}], st)}
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Classes</h3></div>
      <div class="card-b"><div id="clstbl"></div>
      <button class="btn btn-sm btn-primary" id="clsnew" style="margin-top:10px">Add a class</button></div></div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Subjects</h3></div>
      <div class="card-b"><div id="subtbl"></div>
      <button class="btn btn-sm btn-primary" id="subnew" style="margin-top:10px">Add a subject</button></div></div>
    <div class="card" style="border-color:var(--red)"><div class="card-h"><h3 style="color:var(--red)">Danger zone</h3></div>
      <div class="card-b"><p class="small muted">This resets every student, teacher, admission, fee, exam, timetable, homework and
        notice back to the original demo data. You will be signed out.</p>
        <button class="btn btn-danger btn-sm" id="resetdemo">Reset demo data</button></div></div>`);
  return { html, mount(){
    mountShell();
    $('#idsetsave').onclick = () => {
      const name = $('#f_schoolName').value.trim(), short = $('#f_shortName').value.trim();
      if(!name || !short){ toast('School name and logo text cannot be empty.','err'); return; }
      Object.assign(DB.d.settings, { schoolName:name, nameDevanagari:$('#f_nameDevanagari').value.trim(),
        shortName:short, tagline:$('#f_tagline').value.trim(), established:$('#f_established').value.trim() });
      DB.save(); toast('School identity updated successfully.'); render();
    };
    $('#ctsetsave').onclick = () => {
      Object.assign(DB.d.settings, { address:$('#f_address').value.trim(), phone:$('#f_phone').value.trim(),
        email:$('#f_email').value.trim(), timings:$('#f_timings').value.trim(), academicYear:$('#f_academicYear').value.trim() });
      DB.save(); toast('Contact details updated successfully.'); render();
    };
    $('#absetsave').onclick = () => {
      Object.assign(DB.d.settings, { principal:$('#f_principal').value.trim(), about:$('#f_about').value.trim(),
        principalMessage:$('#f_principalMessage').value.trim() });
      DB.save(); toast('About section updated successfully.'); render();
    };
    $('#stsetsave').onclick = () => {
      DB.d.settings.stats = { students:$('#f_statStudents').value.trim(), teachers:$('#f_statTeachers').value.trim(),
        classes:$('#f_statClasses').value.trim(), years:$('#f_statYears').value.trim() };
      DB.save(); toast('Homepage statistics updated successfully.'); render();
    };
    $('#rcsetsave').onclick = () => {
      Object.assign(DB.d.settings, { receiptNote:$('#f_receiptNote').value.trim() });
      DB.save(); toast('Receipt note updated successfully.'); render();
    };
    $('#gsetsave').onclick = () => {
      Object.assign(DB.d.settings, { googleClientId:$('#f_googleClientId').value.trim() });
      DB.save(); toast('Google Sign-In settings updated successfully.'); render();
    };

    function drawClasses(){
      const rows = sortBy(DB.all('classes'), 'order');
      $('#clstbl').innerHTML = `<div class="table-wrap"><table class="dt"><thead><tr>
        <th>Class</th><th>Divisions</th><th>Students</th><th></th></tr></thead>
        <tbody>${rows.map(c=>{ const kids = S.studentsOf(c.id).length;
          return `<tr><td><b>Class ${esc(c.name)}</b></td>
            <td class="small">${S.divisionsOf(c.id).map(d=>d.name).join(', ')||'—'}</td>
            <td class="mono-num">${kids}</td>
            <td class="actions"><button class="btn btn-sm" data-do="cls-edit" data-id="${c.id}">Edit</button>
              <button class="btn btn-sm btn-danger" data-do="cls-del" data-id="${c.id}">Delete</button></td></tr>`; }).join('')}
        </tbody></table></div>`;
    }
    function drawSubjects(){
      const rows = DB.all('subjects');
      $('#subtbl').innerHTML = `<div class="table-wrap"><table class="dt"><thead><tr>
        <th>Subject</th><th>Code</th><th>Type</th><th>Applies to</th><th></th></tr></thead>
        <tbody>${rows.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.code)}</td>
          <td>${s.core?'Core':'Elective'}</td>
          <td class="small">${s.classIds.length===DB.all('classes').length?'All classes':s.classIds.map(S.cls).join(', ')}</td>
          <td class="actions"><button class="btn btn-sm" data-do="sub-edit" data-id="${s.id}">Edit</button>
            <button class="btn btn-sm btn-danger" data-do="sub-del" data-id="${s.id}">Delete</button></td></tr>`).join('')}
        </tbody></table></div>`;
    }
    ACTIONS['cls-new'] = () => formModal({ title:'Add a class', submitLabel:'Add class',
      fields:[{name:'name', label:'Class name', required:true, placeholder:'e.g. 11th'}],
      onSubmit(d){
        if(DB.first('classes', c=>c.name.toLowerCase()===d.name.toLowerCase())){ toast('A class with that name already exists.','err'); return; }
        const order = DB.all('classes').length + 1;
        const c = DB.insert('classes', { name:d.name, level:order, order });
        ['A','B'].forEach(dv => DB.insert('divisions', { classId:c.id, name:dv }));
        closeModal(); drawClasses(); toast('Class added successfully.'); }});
    ACTIONS['cls-edit'] = id => { const c = DB.get('classes', id);
      formModal({ title:'Edit class', submitLabel:'Save changes',
        fields:[{name:'name', label:'Class name', required:true}], values:c,
        onSubmit(d){ DB.update('classes', id, { name:d.name }); closeModal(); drawClasses(); toast('Class updated successfully.'); }}); };
    ACTIONS['cls-del'] = async id => { const c = DB.get('classes', id);
      const kids = S.studentsOf(id);
      if(kids.length){ toast(`Move or remove the ${kids.length} student${kids.length===1?'':'s'} in Class ${c.name} before deleting it.`,'err'); return; }
      if(await confirmDialog('Delete class', `Delete Class ${c.name}? Its divisions, timetable, homework and examinations are removed too.`)){
        S.divisionsOf(id).forEach(d => DB.remove('divisions', d.id));
        DB.where('timetable', r=>r.classId===id).forEach(r=>DB.remove('timetable', r.id));
        DB.where('exams', e=>e.classId===id).forEach(e=>{ DB.where('marks', m=>m.examId===e.id).forEach(m=>DB.remove('marks', m.id)); DB.remove('exams', e.id); });
        DB.where('homework', h=>h.classId===id).forEach(h=>{ DB.where('submissions', su=>su.homeworkId===h.id).forEach(su=>DB.remove('submissions', su.id)); DB.remove('homework', h.id); });
        DB.all('subjects').forEach(s=>{ if(s.classIds.includes(id)) DB.update('subjects', s.id, { classIds: s.classIds.filter(x=>x!==id) }); });
        DB.all('fee_heads').forEach(h=>{ if(Array.isArray(h.appliesTo) && h.appliesTo.includes(id)) DB.update('fee_heads', h.id, { appliesTo: h.appliesTo.filter(x=>x!==id) }); });
        DB.remove('classes', id); drawClasses(); toast('Class deleted.'); } };

    ACTIONS['sub-new'] = () => formModal({ title:'Add a subject', submitLabel:'Add subject',
      fields:[
        {name:'name', label:'Subject name', required:true, full:true},
        {name:'code', label:'Short code', required:true, placeholder:'e.g. MAT'},
        {name:'core', label:'Core subject (compulsory)', type:'checkbox', full:true},
        {name:'scope', label:'Applies to', type:'select', full:true,
          options:[{v:'all',l:'All classes'}, ...DB.all('classes').map(c=>({v:c.id,l:'Class '+c.name+' only'}))]}
      ], values:{scope:'all'},
      onSubmit(d){
        const classIds = d.scope==='all' ? DB.all('classes').map(c=>c.id) : [d.scope];
        DB.insert('subjects', { name:d.name, code:d.code.toUpperCase(), core:!!d.core, classIds });
        closeModal(); drawSubjects(); toast('Subject added successfully.'); }});
    ACTIONS['sub-edit'] = id => { const sub = DB.get('subjects', id);
      formModal({ title:'Edit subject', submitLabel:'Save changes',
        fields:[
          {name:'name', label:'Subject name', required:true, full:true},
          {name:'code', label:'Short code', required:true},
          {name:'core', label:'Core subject (compulsory)', type:'checkbox', full:true},
          {name:'scope', label:'Applies to', type:'select', full:true,
            options:[{v:'all',l:'All classes'}, ...DB.all('classes').map(c=>({v:c.id,l:'Class '+c.name+' only'}))]}
        ], values:{...sub, scope: sub.classIds.length===DB.all('classes').length?'all':(sub.classIds[0]||'all')},
        onSubmit(d){
          const classIds = d.scope==='all' ? DB.all('classes').map(c=>c.id) : [d.scope];
          DB.update('subjects', id, { name:d.name, code:d.code.toUpperCase(), core:!!d.core, classIds });
          closeModal(); drawSubjects(); toast('Subject updated successfully.'); }}); };
    ACTIONS['sub-del'] = async id => { const sub = DB.get('subjects', id);
      const used = DB.first('exams', e=>e.subjectIds.includes(id)) || DB.first('timetable', r=>r.subjectId===id) || DB.first('homework', h=>h.subjectId===id);
      if(used){ toast(`"${sub.name}" is used in an examination, timetable or homework record and cannot be deleted.`,'err'); return; }
      if(await confirmDialog('Delete subject', `Delete "${sub.name}"?`)){ DB.remove('subjects', id); drawSubjects(); toast('Subject deleted.'); } };

    $('#clsnew').onclick = () => ACTIONS['cls-new']();
    $('#subnew').onclick = () => ACTIONS['sub-new']();
    $('#resetdemo').onclick = async () => {
      if(!await confirmDialog('Reset demo data',
        'Every student, teacher, admission, fee, exam, timetable, homework and notice will be reset to the original demo data. This cannot be undone.',
        'Reset everything', true)) return;
      await initDB(true);
      toast('Demo data has been reset. Please sign in again.');
      Auth.logout();
    };
    drawClasses(); drawSubjects();
  }};
});

/* ============================================================
   28. BOOT
   ============================================================ */
(function restoreTheme(){
  try{
    const saved = localStorage.getItem('svm.theme');
    if(saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
})();
(async function boot(){
  await initDB();
  Auth.restore();
  await render();
})();
</script>
